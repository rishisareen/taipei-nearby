<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Taipei Nearby</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Taipei">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{--ink:#16181d;--mute:#6b7280;--line:#e5e7eb;--bg:#fff;--soft:#f4f5f7;--ok:#16803c;--no:#b42318;--accent:#0b63ce;--top:104px;--panel:420px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#eef0f2;color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC","PingFang TC",sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#map{position:fixed;inset:0}

/* filters */
#filters{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(env(safe-area-inset-top) + 8px) 0 8px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#brand{display:none}
.row{display:flex;gap:8px;overflow-x:auto;padding:0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.row+.row{margin-top:8px}
.chip{flex:none;height:38px;padding:0 13px;border-radius:19px;border:1px solid var(--line);background:#fff;font-weight:500;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:background .12s,color .12s,border-color .12s}
.chip.sm{height:34px;font-size:13px;padding:0 11px;background:var(--soft);border-color:transparent}
.chip.on{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:#fff}
.chip:active{transform:scale(.97)}
.sep{flex:none;width:1px;background:var(--line);margin:6px 2px}

/* sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;height:calc(100vh - var(--top) - 8px);height:calc(100dvh - var(--top) - 8px);background:var(--bg);border-radius:18px 18px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.14);display:flex;flex-direction:column;will-change:transform;transform:translate3d(0,60%,0)}
#sheetHead{flex:none;padding:8px 16px 10px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.grab{width:40px;height:5px;border-radius:3px;background:#d1d5db;margin:0 auto 8px}
.hl{display:flex;align-items:center;justify-content:space-between;gap:10px}
#count{font-weight:700;font-size:17px}
#sortBtn{font-size:13px;font-weight:600;color:var(--accent);padding:6px 10px;margin:-6px -10px -6px 0;border-radius:8px}
#originTxt{font-size:12.5px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list,#detail{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
[hidden]{display:none!important}

.card{display:flex;gap:12px;width:100%;text-align:left;padding:12px 16px;border-top:1px solid var(--line);align-items:flex-start;content-visibility:auto;contain-intrinsic-size:auto 84px}
.card:active{background:var(--soft)}
.ico{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:color-mix(in srgb,var(--c) 14%,#fff)}
.cb{min-width:0;flex:1;display:block}
.cn{display:block;font-weight:650;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{color:#f59f00;font-style:normal}
.cm{display:block;font-size:13px;color:var(--mute);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm b{font-weight:600}.op{color:var(--ok)}.cl{color:var(--no)}
.ck{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;margin-top:3px;color:#374151}
.cx{display:none}
.empty{padding:36px 24px;text-align:center;color:var(--mute)}
.empty button{margin-top:12px;color:var(--accent);font-weight:600}
.foot{padding:16px;font-size:12px;color:var(--mute);border-top:1px solid var(--line)}

/* detail */
#detail{padding:0 16px 24px}
.dhead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);padding:4px 0 8px;z-index:1}
.dhead button{font-weight:600;color:var(--accent);padding:8px 10px;margin:0 -10px;border-radius:8px}
.dcat{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);font-weight:500}
.dcat .ico{width:30px;height:30px;font-size:16px;border-radius:9px}
#detail h2{margin:8px 0 2px;font-size:22px;line-height:1.2}
.zh{font-size:18px;color:#374151}
.dq{font-size:14px;color:var(--mute);margin-top:6px}.dq b{font-weight:600}
#sheet.det .hl,#sheet.det #originTxt{display:none}
.dk{font-size:15.5px;margin:12px 0}
.facts{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.facts div{display:flex;gap:10px;padding:10px 12px;font-size:14px}
.facts div+div{border-top:1px solid var(--line)}
.facts span:first-child{flex:none;width:22px;text-align:center}
.tip{background:#fff8e1;border-radius:12px;padding:10px 12px;font-size:14px;margin:12px 0 0}
.acts{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:650;text-decoration:none;color:var(--ink);background:var(--soft)}
.btn.pri{background:var(--accent);color:#fff}
.fine{font-size:12px;color:var(--mute);margin-top:14px}

/* map buttons */
#mapBtns{position:fixed;right:12px;top:calc(var(--top) + 12px);z-index:4;display:flex;flex-direction:column;gap:8px}
.mb{width:44px;height:44px;border-radius:12px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.2);display:grid;place-items:center;font-size:19px;position:relative}
.mb small{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;background:var(--accent);color:#fff;border-radius:6px;padding:0 4px;white-space:nowrap}
.mb.done small{background:var(--ok)}
#toast{position:fixed;left:50%;top:calc(var(--top) + 16px);transform:translate(-50%,-10px);z-index:9;background:rgba(22,24,29,.92);color:#fff;padding:9px 14px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;max-width:78vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.me{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.22),0 1px 4px rgba(0,0,0,.3)}
.pin{font-size:26px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.maplibregl-ctrl-top-left{top:var(--top)}

/* filter panel (mobile) */
.fbtn{font-weight:650;border-color:var(--ink)}
#fp{position:fixed;inset:0;z-index:20;background:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.fph{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-size:19px;border-bottom:1px solid var(--line)}
.fph button{color:var(--accent);font-weight:650;font-size:16px;padding:6px 8px;margin:-6px -8px}
#fpBody{flex:1;overflow-y:auto;padding:2px 16px 20px;-webkit-overflow-scrolling:touch}
#fpBody h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:18px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{min-height:54px;border:1.5px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:8px;padding:6px 12px;font-weight:600;font-size:14.5px;text-align:left;line-height:1.2}
.tile span{font-size:19px}
.tile small{margin-left:auto;color:var(--mute);font-weight:500;font-size:12.5px}
.tile.on{border-color:var(--c,var(--ink));background:color-mix(in srgb,var(--c,var(--ink)) 11%,#fff)}
.tile.on small{color:var(--c,var(--ink));font-weight:700;font-size:15px}
.tile.on small::after{content:' ✓'}
.fpf{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
#fpClr{flex:none;padding:0 14px;height:52px;font-weight:600;color:var(--mute)}
#fpGo{flex:1;height:52px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;font-size:16px}

/* desktop */
@media (min-width:900px){
  :root{--top:0px}
  #panel{position:fixed;left:0;top:0;bottom:0;width:var(--panel);display:flex;flex-direction:column;background:var(--bg);border-right:1px solid var(--line);z-index:6}
  #map{left:var(--panel)}
  #filters{position:static;padding:16px 4px 12px;background:var(--bg)}
  #brand{display:block;padding:0 12px 12px;font-size:20px;font-weight:750}
  #brand small{display:block;font-weight:400;font-size:13px;color:var(--mute)}
  .row{flex-wrap:wrap;overflow:visible;gap:6px}
  .chip{height:32px;font-size:13px;padding:0 10px}.chip.sm{height:30px;font-size:12.5px}
  #sheet{position:static;height:auto;flex:1;min-height:0;transform:none!important;border-radius:0;box-shadow:none}
  #sheetHead{cursor:default;padding-top:12px;border-top:0}
  .grab{display:none}
  .card:hover{background:var(--soft)}
  .cx{display:block;font-size:12.5px;color:var(--mute);margin-top:4px}
  .ck{-webkit-line-clamp:3}
  #mapBtns{top:12px}
  .fbtn,#fp{display:none!important}
  #toast{left:calc(50% + var(--panel)/2);top:16px}
  .maplibregl-ctrl-top-left{top:0}
}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <div id="filters">
    <div id="brand">Taipei Nearby<small>What's worth doing around you, right now</small></div>
    <div class="row" id="catRow"></div>
    <div class="row" id="quickRow"></div>
  </div>
  <div id="sheet">
    <div id="sheetHead">
      <div class="grab"></div>
      <div class="hl"><span id="count"></span><button id="sortBtn"></button></div>
      <div id="originTxt"></div>
    </div>
    <div id="list"></div>
    <div id="detail" hidden></div>
  </div>
</div>
<div id="mapBtns">
  <button class="mb" id="locBtn" aria-label="My location">◎</button>
  <button class="mb" id="offBtn" aria-label="Save map offline">⬇<small hidden></small></button>
</div>
<div id="fp" hidden><div class="fph"><b>Filters</b><button id="fpX">Done</button></div><div id="fpBody"></div><div class="fpf"><button id="fpClr">Clear all</button><button id="fpGo"></button></div></div>
<div id="toast"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="places.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem('tn_'+k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem('tn_'+k,JSON.stringify(v))}catch(e){}}};
const STYLE='https://tiles.openfreemap.org/styles/positron';
const CATS=[['food','Food','🍜','#E8590C'],['cafe','Coffee & tea','☕','#8D6E63'],['sweet','Sweets & boba','🧋','#E64980'],['night','Night markets','🏮','#7048E8'],['sight','Sights','📸','#1C7ED6'],['book','Books','📚','#5C7CFA'],['nature','Parks & walks','🌿','#2F9E44'],['spring','Hot springs','♨️','#1098AD'],['shop','Shopping','🛍️','#E67700'],['family','Family','🎡','#66A80F'],['trip','Day trips','🚆','#495057'],['museum','Art & museums','🖼️','#0CA678'],['temple','Temples','🛕','#C92A2A']];
const CAT={};CATS.forEach(([id,label,emoji,color])=>CAT[id]={id,label,emoji,color});
const BY={};PLACES.forEach(p=>BY[p.id]=p);
const CENTER={lat:25.0478,lng:121.5170};
const mq=matchMedia('(min-width:900px)');
const desktop=()=>mq.matches;

const state={cats:new Set(LS.get('cats',[]).filter(c=>CAT[c])),open:false,walk:0,veg:LS.get('veg',false),saved:false,top:false,brinda:false,sort:'best',sel:null};
const stars=new Set(LS.get('stars',[]));
let gps=null,manual=LS.get('manual',null),shown=[];

/* ---------- geo + time ---------- */
function dist(a,b){const R=6371000,r=Math.PI/180,x=Math.sin((b.lat-a.lat)*r/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin((b.lng-a.lng)*r/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function origin(){if(manual)return{lat:manual.lat,lng:manual.lng,kind:'pin'};if(gps&&dist(gps,CENTER)<60000)return{lat:gps.lat,lng:gps.lng,kind:'gps'};return{lat:HOTEL.lat,lng:HOTEL.lng,kind:'hotel'}}
function tpeNow(){const o={};new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Taipei',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()).forEach(x=>o[x.type]=x.value);return{d:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(o.weekday),m:(+o.hour%24)*60+ +o.minute}}
const hm=s=>{const[a,b]=s.split(':');return +a*60+ +b};
const fmt=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function openInfo(p,now){
  if(!p.h)return null;
  if(p.h==='24h')return{open:true,txt:'Open 24 hours',s:'Open 24h'};
  const x=p.x||[],y=(now.d+6)%7;let next=null;
  for(const r of p.h.split(',')){
    const[a,b]=r.split('-').map(hm),e=b<=a?b+1440:b;
    if(!x.includes(now.d)&&now.m>=a&&now.m<e)return{open:true,txt:'Open now · closes '+fmt(e),s:e-now.m<=45?'Closes '+fmt(e):'Open',soon:e-now.m<=45};
    if(!x.includes(y)&&e>1440&&now.m<e-1440)return{open:true,txt:'Open now · closes '+fmt(e),s:'Open'};
    if(!x.includes(now.d)&&a>now.m&&(next===null||a<next))next=a;
  }
  if(next!==null)return{open:false,txt:'Closed · opens '+fmt(next),s:'Opens '+fmt(next)};
  const t=x.includes(now.d)?'Closed today':'Closed now';return{open:false,txt:t,s:t};
}
const walkTxt=p=>p._w<=60?p._w+' min walk':(p._d/1000).toFixed(1)+' km';
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function compute(){
  const o=origin(),now=tpeNow();
  for(const p of PLACES){p._d=dist(o,p)*1.3;p._w=Math.max(1,Math.round(p._d/78));p._o=openInfo(p,now)}
  shown=PLACES.filter(p=>(!state.cats.size||state.cats.has(p.c))&&(!state.open||(p._o&&p._o.open))&&(!state.walk||p._w<=state.walk)&&(!state.veg||p.c!=='food'||p.v)&&(!state.saved||stars.has(p.id))&&(!state.top||p.p===3)&&(!state.brinda||p.b));
  shown.sort(state.sort==='near'?(a,b)=>a._d-b._d:(a,b)=>(a._w-(a.p-1)*8)-(b._w-(b.p-1)*8));
}

/* ---------- filters ---------- */
const QUICK=[['open','Open now'],['w10','🚶 10 min walk'],['w20','🚶 20 min walk'],['w30','🚶 30 min walk'],['top','Must-see'],['saved','★ Saved'],['veg','🌱 Vegetarian'],['brinda',"Brinda's picks"]];
const qOn=k=>k[0]==='w'&&k.length<4?state.walk===+k.slice(1):state[k];
const nActive=()=>state.cats.size+QUICK.filter(([k])=>qOn(k)).length;
function renderFilters(){
  const n=nActive();
  $('#catRow').innerHTML=`<button class="chip fbtn${n?' on':''}" id="fOpen">☰ Filters${n?' · '+n:''}</button><button class="chip${state.cats.size?'':' on'}" data-cat="">All</button>`+CATS.map(([id,l,e,c])=>`<button class="chip${state.cats.has(id)?' on':''}" style="--c:${c}" data-cat="${id}">${e} ${l}</button>`).join('');
  $('#quickRow').innerHTML=QUICK.map(([k,l])=>`<button class="chip sm${qOn(k)?' on':''}" data-q="${k}">${l.replace(' walk','')}</button>`).join('');
  if(!$('#fp').hidden)renderPanel();
}
function renderPanel(){
  const cnt={};PLACES.forEach(p=>cnt[p.c]=(cnt[p.c]||0)+1);
  $('#fpBody').innerHTML='<h3>What are you after?</h3><div class="grid">'+CATS.map(([id,l,e,c])=>`<button class="tile${state.cats.has(id)?' on':''}" style="--c:${c}" data-cat="${id}"><span>${e}</span>${l}<small>${cnt[id]||0}</small></button>`).join('')+'</div><h3>Narrow it down</h3><div class="grid">'+QUICK.map(([k,l])=>`<button class="tile${qOn(k)?' on':''}" data-q="${k}">${l}<small></small></button>`).join('')+'</div>';
  $('#fpGo').textContent='Show '+shown.length+(shown.length===1?' place':' places');
}
function onFilterClick(e){
  if(e.target.closest('#fOpen')){$('#fp').hidden=false;renderPanel();return}
  const b=e.target.closest('[data-cat],[data-q]');if(!b)return;
  if('cat' in b.dataset){const c=b.dataset.cat;if(!c)state.cats.clear();else state.cats.has(c)?state.cats.delete(c):state.cats.add(c)}
  else{const k=b.dataset.q;if(k[0]==='w'&&k.length<4){const n=+k.slice(1);state.walk=state.walk===n?0:n}else state[k]=!state[k]}
  LS.set('cats',[...state.cats]);LS.set('veg',state.veg);closeDetail(true);refresh(true);
}
['#catRow','#quickRow','#fpBody'].forEach(q=>$(q).addEventListener('click',onFilterClick));
$('#fpGo').onclick=$('#fpX').onclick=()=>{$('#fp').hidden=true};
$('#fpClr').onclick=()=>clearFilters();
function clearFilters(){state.cats.clear();state.open=state.saved=state.top=state.brinda=state.veg=false;state.walk=0;LS.set('cats',[]);LS.set('veg',false);refresh(true)}

/* ---------- list ---------- */
function card(p){const c=CAT[p.c],o=p._o;
  return `<button class="card" data-id="${p.id}"><span class="ico" style="--c:${c.color}">${c.emoji}</span><span class="cb"><span class="cn">${esc(p.n)}${stars.has(p.id)?' <i class="st">★</i>':''}</span><span class="cm">${walkTxt(p)} · ${c.label}${o?` · <b class="${o.open&&!o.soon?'op':'cl'}">${o.s}</b>`:''}</span><span class="ck">${esc(p.k)}</span><span class="cx">${esc(p.z)} · ${esc(p.a)}${p.m?' · MRT '+esc(p.m):''}${p.t?' · allow '+dur(p.t):''}</span></span></button>`}
const dur=t=>t<60?t+' min':(Math.round(t/30)/2)+' h';
function renderList(){
  const n=shown.length;
  $('#count').textContent=n+(n===1?' place':' places');
  $('#sortBtn').textContent=state.sort==='best'?'Best nearby ⇅':'Nearest first ⇅';
  const o=origin();
  $('#originTxt').textContent=o.kind==='gps'?'Walking times from where you are now':o.kind==='pin'?'Walking times from your dropped pin · ◎ to reset':gps?"You're outside Taipei · measuring from your hotel":gpsDenied?'Location is off · tap ◎ to see how to turn it on':'Measuring from your hotel · tap ◎ to use your location';
  $('#list').innerHTML=n?shown.map(card).join('')+'<div class="foot">Opening hours are a guide, not live. Tap a place, then Google Maps, to confirm before a long trip.</div>':'<div class="empty">Nothing matches these filters.<br><button id="clr">Clear all filters</button></div>';
}
$('#list').addEventListener('click',e=>{if(e.target.id==='clr')return clearFilters();const b=e.target.closest('.card');if(b)select(b.dataset.id)});
$('#sortBtn').addEventListener('click',e=>{e.stopPropagation();state.sort=state.sort==='best'?'near':'best';refresh(true)});
$('#sortBtn').addEventListener('pointerdown',e=>e.stopPropagation());

/* ---------- detail ---------- */
const PRICE=['Free','Under NT$200','NT$200–600','NT$600–1,500','NT$1,500+'];
function renderDetail(p){const c=CAT[p.c],o=p._o,far=p._w>35;
  const dir=`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=${far?'transit':'walking'}`;
  const gm=`https://www.google.com/maps/search/${encodeURIComponent(p.z)}/@${p.lat},${p.lng},17z`;
  const closed=(p.x||[]).length?' · closed '+p.x.map(d=>DAYS[d]).join(', '):'';
  $('#detail').innerHTML=`<div class="dhead"><button id="back">‹ Back to list</button><button id="starBtn">${stars.has(p.id)?'★ Saved':'☆ Save'}</button></div>
  <div class="dcat"><span class="ico" style="--c:${c.color}">${c.emoji}</span>${c.label} · ${esc(p.a)}${p.p===3?' · Must-see':''}${p.b?' · Brinda':''}</div>
  <h2>${esc(p.n)}</h2>${p.z!==p.n?`<div class="zh">${esc(p.z)}</div>`:''}
  <div class="dq">${walkTxt(p)}${o?` · <b class="${o.open&&!o.soon?'op':'cl'}">${o.s}</b>`:''}</div>
  <div class="acts"><a class="btn pri" href="${dir}" target="_blank" rel="noopener">Directions</a><a class="btn" href="${gm}" target="_blank" rel="noopener">Google Maps</a></div>
  <p class="dk">${esc(p.k)}</p>
  <div class="facts">
   <div><span>🚶</span><span>${p._w<=60?p._w+' min walk ('+(p._d<950?Math.round(p._d/10)*10+' m':(p._d/1000).toFixed(1)+' km')+')':(p._d/1000).toFixed(1)+' km away'}</span></div>
   <div><span>🕒</span><span>${o?`<b class="${o.open?'op':'cl'}">${o.txt}</b><br>${p.h==='24h'?'Always open':esc(p.h.replace(/,/g,', ').replace(/-/g,'–'))+closed}`:'Hours not listed · check Google Maps'}</span></div>
   ${p.m?`<div><span>🚇</span><span>${esc(p.m)}</span></div>`:''}
   <div><span>⏱</span><span>Allow ${dur(p.t)}${p.pr!=null?' · '+PRICE[p.pr]:''}</span></div>
  </div>
  ${p.tip?`<p class="tip">💡 ${esc(p.tip)}</p>`:''}
  <p class="fine">Hours and prices are a guide and may have changed.</p>`;
  $('#detail').scrollTop=0;
}
$('#detail').addEventListener('click',e=>{
  if(e.target.id==='back')closeDetail();
  if(e.target.id==='starBtn'){const id=state.sel;stars.has(id)?stars.delete(id):stars.add(id);LS.set('stars',[...stars]);e.target.textContent=stars.has(id)?'★ Saved':'☆ Save';renderList()}
});
function select(id){const p=BY[id];if(!p)return;state.sel=id;renderDetail(p);$('#list').hidden=true;$('#detail').hidden=false;sheet.classList.add('det');
  if(!desktop()&&sheetState!=='half')setSheet('half');
  setSel(p);if(map)map.easeTo({center:[p.lng,p.lat],zoom:Math.max(map.getZoom(),15),padding:pad(),duration:500});}
function closeDetail(quiet){if(state.sel==null)return;state.sel=null;$('#detail').hidden=true;$('#list').hidden=false;sheet.classList.remove('det');setSel(null)}
addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});

/* ---------- bottom sheet (mobile) ---------- */
const sheet=$('#sheet'),head=$('#sheetHead');let snaps={full:0,half:0,peek:0},sheetState='half',sheetY=0;
function layout(){
  if(desktop()){document.documentElement.style.setProperty('--top','0px');sheet.style.transform='';$('#list').style.paddingBottom=$('#detail').style.paddingBottom='';return}
  document.documentElement.style.setProperty('--top',$('#filters').offsetHeight+'px');
  const H=sheet.offsetHeight;snaps={full:0,half:Math.round(H*.52),peek:H-118};setSheet(sheetState,false);
}
function applyY(y,anim){sheetY=y;sheet.style.transition=anim?'transform .3s cubic-bezier(.2,.85,.25,1)':'none';sheet.style.transform=`translate3d(0,${y}px,0)`}
function setSheet(st,anim=true){sheetState=st;applyY(snaps[st],anim);const pb=`calc(${snaps[st]}px + env(safe-area-inset-bottom) + 16px)`;$('#list').style.paddingBottom=pb;$('#detail').style.paddingBottom=pb}
function pad(){return desktop()?{top:0,bottom:0,left:0,right:0}:{top:$('#filters').offsetHeight,bottom:Math.max(0,sheet.offsetHeight-snaps[sheetState==='full'?'half':sheetState]),left:0,right:0}}
let drag=null;
head.addEventListener('pointerdown',e=>{if(desktop())return;drag={y:e.clientY,s:sheetY,t:e.timeStamp,ly:e.clientY,lt:e.timeStamp,v:0,moved:false};head.setPointerCapture(e.pointerId)});
head.addEventListener('pointermove',e=>{if(!drag)return;const dy=e.clientY-drag.y;if(Math.abs(dy)>6)drag.moved=true;const dt=e.timeStamp-drag.lt;if(dt>0)drag.v=(e.clientY-drag.ly)/dt;drag.ly=e.clientY;drag.lt=e.timeStamp;applyY(Math.min(snaps.peek,Math.max(0,drag.s+dy)),false)});
const endDrag=()=>{if(!drag)return;const d=drag;drag=null;
  if(!d.moved){setSheet(sheetState==='peek'?'half':sheetState==='half'?'full':'half');return}
  const order=['full','half','peek'];let best='half';
  if(Math.abs(d.v)>.45){const i=order.indexOf(order.reduce((a,b)=>Math.abs(snaps[a]-d.s)<Math.abs(snaps[b]-d.s)?a:b));best=order[Math.min(2,Math.max(0,i+(d.v>0?1:-1)))]}
  else best=order.reduce((a,b)=>Math.abs(snaps[a]-sheetY)<Math.abs(snaps[b]-sheetY)?a:b);
  setSheet(best)};
head.addEventListener('pointerup',endDrag);head.addEventListener('pointercancel',endDrag);
addEventListener('resize',layout);mq.addEventListener('change',()=>{layout();map&&map.resize()});

/* ---------- map ---------- */
let map=null,mapReady=false,meMarker=null,pinMarker=null;
const fc=a=>({type:'FeatureCollection',features:a.map(p=>({type:'Feature',geometry:{type:'Point',coordinates:[p.lng,p.lat]},properties:{id:p.id,n:p.n,p:p.p,color:CAT[p.c].color}}))});
function setSel(p){if(mapReady)map.getSource('sel').setData(fc(p?[p]:[]))}
function el(cls,txt){const d=document.createElement('div');d.className=cls;if(txt)d.textContent=txt;return d}
function initMap(){
  if(!window.maplibregl){toast('Map could not load. The list still works.');return}
  const o=origin();
  map=new maplibregl.Map({container:'map',style:STYLE,center:[o.lng,o.lat],zoom:14,minZoom:9.5,maxZoom:18,maxBounds:[[120.9,24.5],[122.4,25.6]],attributionControl:false,dragRotate:false,pitchWithRotate:false,fadeDuration:120});
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.AttributionControl({compact:true}),'top-left');
  map.setPadding(pad());
  new maplibregl.Marker({element:el('pin','🏨')}).setLngLat([HOTEL.lng,HOTEL.lat]).addTo(map);
  meMarker=new maplibregl.Marker({element:el('me')});
  pinMarker=new maplibregl.Marker({element:el('pin','📍'),anchor:'bottom'});
  if(manual)pinMarker.setLngLat([manual.lng,manual.lat]).addTo(map);
  if(gps)meMarker.setLngLat([gps.lng,gps.lat]).addTo(map);
  map.on('load',()=>{
    map.addSource('pl',{type:'geojson',data:fc(shown)});
    map.addSource('sel',{type:'geojson',data:fc(state.sel?[BY[state.sel]]:[])});
    map.addLayer({id:'pl-dot',type:'circle',source:'pl',paint:{'circle-color':['get','color'],'circle-stroke-color':'#fff','circle-stroke-width':['interpolate',['linear'],['zoom'],11,1,14,2],'circle-radius':['interpolate',['linear'],['zoom'],10,['match',['get','p'],3,4,2.5],14,['match',['get','p'],3,8.5,2,7,6],17,12]}});
    map.addLayer({id:'pl-sel',type:'circle',source:'sel',paint:{'circle-color':['get','color'],'circle-radius':14,'circle-stroke-color':'#16181d','circle-stroke-width':3}});
    map.addLayer({id:'pl-lab',type:'symbol',source:'pl',minzoom:13.2,layout:{'text-field':['get','n'],'text-font':['Noto Sans Bold'],'text-size':11.5,'text-anchor':'top','text-offset':[0,1],'text-max-width':9,'text-optional':true,'symbol-sort-key':['-',4,['get','p']]},paint:{'text-color':'#16181d','text-halo-color':'#fff','text-halo-width':1.6}});
    mapReady=true;
  });
  map.on('click',e=>{const r=18,f=map.queryRenderedFeatures([[e.point.x-r,e.point.y-r],[e.point.x+r,e.point.y+r]],{layers:['pl-dot']});
    if(!f.length){if(state.sel)closeDetail();return}
    let best=f[0],bd=1e9;for(const x of f){const q=map.project(x.geometry.coordinates),d=(q.x-e.point.x)**2+(q.y-e.point.y)**2;if(d<bd){bd=d;best=x}}
    select(best.properties.id)});
  map.on('mouseenter','pl-dot',()=>map.getCanvas().style.cursor='pointer');
  map.on('mouseleave','pl-dot',()=>map.getCanvas().style.cursor='');
  map.on('contextmenu',e=>setManual(e.lngLat));
  let lp=null,lpPt=null;const cancel=()=>{clearTimeout(lp);lp=null};
  map.on('touchstart',e=>{cancel();if(e.originalEvent.touches.length>1)return;const ll=e.lngLat;lpPt=e.point;lp=setTimeout(()=>{setManual(ll);navigator.vibrate&&navigator.vibrate(12)},650)});
  map.on('touchmove',e=>{if(lp&&lpPt&&Math.hypot(e.point.x-lpPt.x,e.point.y-lpPt.y)>8)cancel()});
  map.on('touchend',cancel);map.on('touchcancel',cancel);
}
function setManual(ll){manual={lat:ll.lat,lng:ll.lng};LS.set('manual',manual);pinMarker.setLngLat([ll.lng,ll.lat]).addTo(map);toast('Measuring from this pin');refresh(true)}
function refresh(scrollTop){compute();renderFilters();renderList();if(scrollTop)$('#list').scrollTop=0;if(mapReady)map.getSource('pl').setData(fc(shown));else if(map)map.once('load',()=>map.getSource('pl').setData(fc(shown)));if(state.sel)renderDetail(BY[state.sel])}

/* ---------- location ---------- */
let watchId=null,gpsDenied=false;
const LOC_HELP='Location is blocked. On iPhone: Settings → Privacy & Security → Location Services → Safari Websites → While Using the App. Then close and reopen this app.';
function onPos(pos){
  const n={lat:pos.coords.latitude,lng:pos.coords.longitude},first=!gps,moved=!gps||dist(gps,n)>25;gps=n;gpsDenied=false;
  if(meMarker&&map)meMarker.setLngLat([n.lng,n.lat]).addTo(map);
  if(moved)refresh(false);
  if(first&&map&&origin().kind==='gps')map.easeTo({center:[n.lng,n.lat],zoom:15,padding:pad(),duration:600});
}
function startGPS(byUser){
  const G=navigator.geolocation;
  if(!G){byUser&&toast('This device has no location service');return}
  if(watchId!=null){G.clearWatch(watchId);watchId=null}
  const fail=err=>{
    if(err.code===1){gpsDenied=true;if(watchId!=null){G.clearWatch(watchId);watchId=null}renderList();if(byUser)toast(LOC_HELP,9000)}
    else if(byUser&&!gps)toast('Still looking for your location. Try near a window or outdoors.',5000);
  };
  // Quick coarse fix first (works indoors), then a precise live watch.
  G.getCurrentPosition(onPos,fail,{enableHighAccuracy:false,maximumAge:60000,timeout:15000});
  watchId=G.watchPosition(onPos,err=>{if(err.code===1)fail(err)},{enableHighAccuracy:true,maximumAge:5000});
}
$('#locBtn').addEventListener('click',()=>{
  if(manual){manual=null;LS.set('manual',null);pinMarker.remove();refresh(true)}
  if(!gps){startGPS(true);const o=origin();map&&map.easeTo({center:[o.lng,o.lat],zoom:14.5,padding:pad()});return}
  const o=origin();if(o.kind!=='gps')toast("You're outside Taipei, so I'm measuring from your hotel");
  map&&map.easeTo({center:[o.lng,o.lat],zoom:15,padding:pad(),duration:600});
});

/* ---------- offline ---------- */
const offBtn=$('#offBtn'),offLbl=offBtn.querySelector('small');
function offState(){const o=LS.get('offline',null);if(o){offBtn.classList.add('done');offLbl.hidden=false;offLbl.textContent='✓'}}
const lon2x=(l,z)=>Math.floor((l+180)/360*2**z),lat2y=(l,z)=>Math.floor((1-Math.log(Math.tan(l*Math.PI/180)+1/Math.cos(l*Math.PI/180))/Math.PI)/2*2**z);
const AREAS=[[[121.30,24.80,121.95,25.30],[9,10,11,12]],[[121.42,24.94,121.63,25.20],[13,14]],[[121.80,25.08,121.87,25.13],[13,14]],[[121.75,25.02,121.80,25.06],[13,14]],[[121.67,25.19,121.71,25.22],[13,14]],[[121.53,24.84,121.57,24.88],[13,14]],[[121.72,25.11,121.77,25.15],[13,14]],[[121.40,25.15,121.46,25.20],[13,14]]];
let downloading=false;
async function downloadOffline(){
  if(downloading)return;
  if(!('serviceWorker' in navigator)){toast('Offline saving needs the app opened over https');return}
  if(!navigator.onLine){toast('Connect to Wi-Fi first to save the map');return}
  downloading=true;offLbl.hidden=false;offBtn.classList.remove('done');offLbl.textContent='0%';
  try{
    await navigator.serviceWorker.ready;
    if(!navigator.serviceWorker.controller)await new Promise(r=>{navigator.serviceWorker.addEventListener('controllerchange',r,{once:true});setTimeout(r,3000)});
    navigator.storage&&navigator.storage.persist&&navigator.storage.persist();
    const style=await(await fetch(STYLE)).json();
    const src=Object.values(style.sources).find(s=>s.type==='vector');
    const tj=await(await fetch(src.url)).json(),tpl=tj.tiles[0],urls=new Set();
    for(const[b,zs]of AREAS)for(const z of zs)for(let x=lon2x(b[0],z);x<=lon2x(b[2],z);x++)for(let y=lat2y(b[3],z);y<=lat2y(b[1],z);y++)urls.add(tpl.replace('{z}',z).replace('{x}',x).replace('{y}',y));
    const fonts=new Set();style.layers.forEach(l=>l.layout&&Array.isArray(l.layout['text-font'])&&l.layout['text-font'].forEach(f=>typeof f==='string'&&fonts.add(f)));fonts.add('Noto Sans Bold');
    for(const f of fonts)for(const r of['0-255','256-511','768-1023','8192-8447','12288-12543','65024-65279','65280-65535'])urls.add(style.glyphs.replace('{fontstack}',encodeURIComponent(f)).replace('{range}',r));
    if(typeof style.sprite==='string')for(const s of['.json','.png','@2x.json','@2x.png'])urls.add(style.sprite+s);
    const q=[...urls],total=q.length;let done=0,bytes=0,fail=0;
    await Promise.all(Array.from({length:8},async()=>{while(q.length){const u=q.pop();try{const r=await fetch(u);if(r.ok)bytes+=(await r.blob()).size;else if(r.status!==404&&r.status!==204)fail++}catch(e){fail++}done++;if(done%5===0||done===total)offLbl.textContent=Math.round(done/total*100)+'%'}}));
    if(fail>total*.05){toast(`Saved with ${fail} gaps. Tap ⬇ again on better Wi-Fi.`);offLbl.textContent='!'}
    else{LS.set('offline',{at:Date.now(),mb:+(bytes/1e6).toFixed(1)});offState();toast(`Taipei map saved for offline use (${(bytes/1e6).toFixed(0)} MB)`)}
  }catch(e){toast('Could not save the map. Check your connection and try again.');offLbl.hidden=true}
  downloading=false;
}
offBtn.addEventListener('click',()=>{const o=LS.get('offline',null);if(o&&!downloading&&!confirm('The Taipei map is already saved. Download it again?'))return;downloadOffline()});

/* ---------- misc ---------- */
let toastT;function toast(t,ms){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),ms||3200)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
compute();renderFilters();renderList();layout();initMap();offState();startGPS(false);
setInterval(()=>{if(!document.hidden&&state.sel==null)refresh(false)},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){refresh(false);if(!gpsDenied)startGPS(false)}});
</script>
</body>
</html>
