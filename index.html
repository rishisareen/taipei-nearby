<!doctype html>
<html lang="en">
<head>
<script>if(location.protocol==="http:"&&!/^(localhost|127\.|\[::1\])/.test(location.host))location.replace("https://"+location.host+location.pathname+location.search)</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Taiwan Nearby</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Taiwan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{--ink:#1c1c1e;--sub:#636366;--mute:#8e8e93;--line:rgba(60,60,67,.13);--bg:#fff;--fill:#f2f2f7;--fill2:#e5e5ea;--ok:#248a3d;--no:#d70015;--accent:#007aff;--top:60px;--panel:400px;--ease:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#e8eaed;color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,"PingFang TC","Noto Sans TC",sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;letter-spacing:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
svg{display:block}
[hidden]{display:none!important}
#map{position:fixed;inset:0}

/* chips */
#filters{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(env(safe-area-inset-top) + 8px) 0 4px;pointer-events:none}
.row{display:flex;gap:8px;overflow-x:auto;padding:2px 12px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch;pointer-events:auto}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.07),0 2px 8px rgba(0,0,0,.1);font-weight:500;font-size:15px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:transform .2s var(--ease),background .15s,color .15s}
.chip.on{background:var(--c,var(--ink));color:#fff}
.chip:active{transform:scale(.94)}
.fbtn{padding:0 12px;font-weight:600}
.bar{display:grid;grid-template-columns:repeat(7,1fr);margin:0 10px;padding:4px;pointer-events:auto;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-radius:20px;box-shadow:0 0 0 .5px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.12)}
.g{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;border-radius:16px;font-size:11px;font-weight:500;color:var(--sub);position:relative;transition:background .2s,color .2s,transform .2s var(--ease)}
.g span{font-size:21px;height:26px;display:grid;place-items:center;color:var(--accent)}
.g.on{background:var(--ink);color:#fff;font-weight:600}
.g:active{transform:scale(.9)}
.g i{position:absolute;top:1px;right:5px;font-style:normal;min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
#subRow{position:absolute;left:0;right:0;top:100%;padding-top:4px;animation:rise .28s var(--ease)}
.fbtn i{font-style:normal;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;height:calc(100vh - var(--top) - 4px);height:calc(100dvh - var(--top) - 4px);background:var(--bg);border-radius:16px 16px 0 0;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 -8px 32px rgba(0,0,0,.14);display:flex;flex-direction:column;will-change:transform;transform:translate3d(0,60%,0);transition:background .2s}
#sheet.det{background:var(--fill)}
#sheetHead{flex:none;padding:6px 16px 10px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.grab{width:36px;height:5px;border-radius:3px;background:#c7c7cc;margin:0 auto 8px}
.hl{display:flex;align-items:center;justify-content:space-between;gap:10px}
#cityBtn{display:flex;align-items:center;gap:7px;font-size:24px;font-weight:700;letter-spacing:-.025em;padding:2px 0}
#cityBtn i{width:22px;height:22px;border-radius:50%;background:var(--fill2);color:var(--sub);display:grid;place-items:center}
#cityBtn:active{opacity:.6}
#sortBtn{font-size:15px;color:var(--accent);padding:6px 0 6px 10px}
#sortBtn:active{opacity:.5}
#originTxt{font-size:13px;color:var(--mute);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheet.det #sheetHead{padding-bottom:0}
#sheet.det .hl,#sheet.det #originTxt{display:none}
#list,#detail{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

.card{display:flex;gap:12px;width:100%;text-align:left;padding:11px 0 0 16px;align-items:flex-start;content-visibility:auto;contain-intrinsic-size:auto 96px;transition:background .15s}
.card:active{background:var(--fill)}
.ico{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c) 15%,#fff)}
.cb{min-width:0;flex:1;display:block;padding:0 16px 11px 0;border-bottom:.5px solid var(--line)}
.cn{display:block;font-weight:600;font-size:17px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{color:#ff9f0a;font-style:normal;font-size:14px}
.cm{display:block;font-size:14px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm b,.op,.cl{font-weight:500}.op{color:var(--ok)}.cl{color:var(--no)}
.ck{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;margin-top:3px;color:var(--mute)}
.cx{display:none}
.empty{padding:48px 24px;text-align:center;color:var(--mute)}
.empty button{display:block;margin:14px auto 0;color:var(--accent);font-weight:600}
.foot{padding:16px;font-size:12.5px;color:var(--mute)}

/* detail */
#detail{padding:2px 16px 24px;animation:rise .32s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.dtop{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
#detail h2{margin:0;font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.025em}
.zh{font-size:15px;color:var(--sub);margin-top:3px}
.dsub{font-size:15px;color:var(--sub);margin-top:3px}
.x{flex:none;width:30px;height:30px;border-radius:50%;background:var(--fill2);color:var(--sub);display:grid;place-items:center}
.x:active{opacity:.6}
.acts{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:14px}
.btn{height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--accent);background:#fff;font-size:12.5px;font-weight:600;transition:transform .2s var(--ease),opacity .15s}
.btn:active{transform:scale(.96);opacity:.8}
.btn b{font-size:16px;font-weight:600}.btn.pri span{font-weight:500;opacity:.85}
.btn.pri{background:var(--accent);color:#fff}
.btn .star{font-size:19px;line-height:20px}
.stats{display:flex;margin-top:16px;padding:2px 0}
.stats div{flex:1;min-width:0;padding:0 10px;border-left:.5px solid var(--line)}
.stats div:first-child{padding-left:2px;border:0}
.stats small{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--mute)}
.stats b{display:block;font-size:15px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp{background:#fff;border-radius:12px;padding:12px 14px;margin-top:14px;font-size:15.5px}
.grp h4{margin:0 0 4px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--mute)}
.grp p{margin:0}
.grp.kv{padding:0 14px}
.kv div{display:flex;gap:16px;justify-content:space-between;padding:11px 0;font-size:15px}
.kv div+div{border-top:.5px solid var(--line)}
.kv span:first-child{flex:none;color:var(--sub)}
.kv span:last-child{text-align:right}
.fine{font-size:12.5px;color:var(--mute);margin:14px 2px 0}

/* map controls */
#mapBtns{position:fixed;right:12px;top:calc(var(--top) + var(--sub,0px) + 4px);transition:top .3s var(--ease);z-index:4;display:flex;flex-direction:column;border-radius:12px;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 2px 10px rgba(0,0,0,.14)}
.mb{width:44px;height:44px;display:grid;place-items:center;color:var(--accent);position:relative}
.mb+.mb{border-top:.5px solid var(--line)}
.mb:active{opacity:.5}
.mb.live svg{fill:var(--accent)}
.mb small{position:absolute;bottom:3px;right:3px;font-size:9px;font-weight:700;background:var(--accent);color:#fff;border-radius:7px;padding:0 4px;line-height:14px;white-space:nowrap}
.mb.done small{background:#34c759}
#toast{position:fixed;left:50%;top:calc(var(--top) + var(--sub,0px) + 8px);transform:translate(-50%,-12px) scale(.96);z-index:30;background:rgba(40,40,42,.88);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.3s var(--ease);max-width:calc(100vw - 80px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.me{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 7px rgba(0,122,255,.18),0 1px 4px rgba(0,0,0,.3)}
.pin{font-size:26px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.hpin{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.maplibregl-ctrl-top-left{top:calc(var(--top) + var(--sub,0px) + 2px);transition:top .3s var(--ease)}
.maplibregl-ctrl-top-left .maplibregl-ctrl{margin:2px 0 0 12px}
.maplibregl-ctrl-attrib{font-size:10px;opacity:.75}

/* modals */
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,0);visibility:hidden;transition:background .3s,visibility 0s .35s;display:flex;align-items:flex-end;justify-content:center}
.ov.open{background:rgba(0,0,0,.32);visibility:visible;transition:background .3s}
.ov>div{width:100%;max-width:520px;transform:translate3d(0,105%,0);transition:transform .42s var(--ease)}
.ov.open>div{transform:none}
.fpc{height:min(88dvh,760px);background:var(--fill);border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden}
.fph{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 16px 12px;font-size:17px}
.fph b{font-weight:600}
.fph button{color:var(--accent);font-size:17px;justify-self:start}
.fph button:last-child{justify-self:end;font-weight:600}
#fpBody{flex:1;overflow-y:auto;padding:0 16px 20px;-webkit-overflow-scrolling:touch}
#fpBody h3{font-size:13px;font-weight:400;text-transform:uppercase;letter-spacing:.01em;color:var(--sub);margin:22px 4px 8px}
#fpBody h3:first-child{margin-top:6px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:rgba(118,118,128,.14);border-radius:9px;padding:2px}
.seg button{height:34px;border-radius:7px;font-size:14px;font-weight:500;transition:background .2s,box-shadow .2s}
.seg button.on{background:#fff;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04)}
.tgs{background:#fff;border-radius:12px;padding:0 0 0 14px}
.tg{display:flex;width:100%;align-items:center;justify-content:space-between;text-align:left;padding:9px 14px 9px 0;font-size:16px}
.tg+.tg{border-top:.5px solid var(--line)}
.tg i{flex:none;width:51px;height:31px;border-radius:16px;background:#e9e9ea;position:relative;transition:background .25s}
.tg i::after{content:'';position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.22);transition:transform .28s var(--ease)}
.tg.on i{background:#34c759}.tg.on i::after{transform:translateX(20px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{min-height:52px;background:#fff;border-radius:12px;display:flex;align-items:center;gap:9px;padding:6px 12px;font-weight:500;font-size:15px;text-align:left;line-height:1.2;transition:transform .2s var(--ease),background .15s,color .15s}
.tile:active{transform:scale(.96)}
.tile span{font-size:19px}
.tile small{margin-left:auto;color:var(--mute);font-size:13px}
.tile.on{background:var(--c);color:#fff}.tile.on small{color:rgba(255,255,255,.8)}
.fpf{padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:var(--fill)}
#fpGo{width:100%;height:50px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;font-size:17px;transition:transform .2s var(--ease)}
#fpGo:active{transform:scale(.97)}
.cmc{padding:0 8px calc(8px + env(safe-area-inset-bottom))}
.cml{background:rgba(250,250,250,.96);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:14px;overflow:hidden}
.cmt{text-align:center;font-size:13px;color:var(--mute);padding:14px}
.cmr{display:flex;width:100%;align-items:center;gap:12px;text-align:left;padding:12px 16px;border-top:.5px solid var(--line)}
.cmr:active{background:var(--fill2)}
.cmr b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em}
.cmr small{display:block;font-size:13px;color:var(--mute);margin-top:1px}
.cmr svg{margin-left:auto;color:var(--accent)}
#cmX{width:100%;height:56px;margin-top:8px;border-radius:14px;background:#fff;color:var(--accent);font-size:19px;font-weight:600}

@media (min-width:900px){
  :root{--top:0px;--sub:0px!important}
  #subRow{display:none!important}
  #panel{position:fixed;left:0;top:0;bottom:0;width:var(--panel);display:flex;flex-direction:column;background:var(--bg);box-shadow:.5px 0 0 var(--line);z-index:6}
  #map{left:var(--panel)}
  #filters{position:static;padding:14px 4px 0;pointer-events:auto;order:2}
  .row{flex-wrap:wrap;overflow:visible;gap:6px;padding-bottom:10px}
  .chip{height:32px;font-size:14px;padding:0 12px;background:var(--fill);box-shadow:none}
  #sheet{display:contents}
  #sheetHead{order:1;cursor:default;padding:20px 16px 0}
  #list,#detail{order:3;min-height:0}
  #detail{background:var(--fill);padding-top:16px}
  #sheet.det~*{}
  .grab{display:none}
  .card:hover{background:var(--fill)}
  .cx{display:block;font-size:13px;color:var(--mute);margin-top:4px}
  .ck{-webkit-line-clamp:3}
  #mapBtns{top:12px}
  #toast{left:calc(50% + var(--panel)/2);top:16px}
  .maplibregl-ctrl-top-left{top:0}
  .ov{align-items:center}
  .fpc{border-radius:16px;height:min(80vh,720px)}
  .cmc{max-width:360px!important;padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <div id="filters"><div class="row" id="catRow"></div><div class="row" id="subRow" hidden></div></div>
  <div id="sheet">
    <div id="sheetHead">
      <div class="grab"></div>
      <div class="hl"><button id="cityBtn"><span id="cityName"></span><i><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></i></button><button id="sortBtn"></button></div>
      <div id="originTxt"></div>
    </div>
    <div id="list"></div>
    <div id="detail" hidden></div>
  </div>
</div>
<div id="mapBtns">
  <button class="mb" id="locBtn" aria-label="My location"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20.3 3.7 3.9 10.5c-.5.2-.4.9.1 1l6.4 1.3c.4.1.7.4.8.8l1.300 6.400c.1.5.8.6 1 .1z"/></svg></button>
  <button class="mb" id="offBtn" aria-label="Save map offline"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4.500-4.500M12 15l4.500-4.500M5 20h14"/></svg><small hidden></small></button>
</div>
<div id="fp" class="ov"><div class="fpc"><div class="fph"><button id="fpClr">Clear</button><b>Filters</b><button id="fpX">Done</button></div><div id="fpBody"></div><div class="fpf"><button id="fpGo"></button></div></div></div>
<div id="cm" class="ov"><div class="cmc"><div class="cml"><div class="cmt">Where are you?</div><div id="cmBody"></div></div><button id="cmX">Cancel</button></div></div>
<div id="toast"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="places.js"></script>
<script src="places-taichung.js"></script>
<script src="places-tainan.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem('tn_'+k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem('tn_'+k,JSON.stringify(v))}catch(e){}}};
const STYLE='https://tiles.openfreemap.org/styles/positron';
const CATS=[['food','Food','🍜','#FF6B00'],['cafe','Coffee & tea','☕','#A2693A'],['sweet','Sweets & boba','🧋','#FF2D78'],['night','Night markets','🏮','#AF52DE'],['sight','Sights','📸','#007AFF'],['book','Books','📚','#5856D6'],['nature','Parks & walks','🌿','#34A853'],['run','Running','🏃','#FF3B30'],['swim','Swimming','🏊','#00A3D7'],['spring','Hot springs','♨️','#0FA3A3'],['shop','Shopping','🛍️','#FF9500'],['family','Family','🎡','#7AB800'],['trip','Day trips','🚆','#5E6672'],['museum','Art & museums','🖼️','#00A67D'],['temple','Temples','🛕','#D03A2B']];
const CAT={};CATS.forEach(([id,label,emoji,color])=>CAT[id]={id,label,emoji,color});
PLACES.forEach(p=>p.ct='tp');(window.PLACES_TC||[]).forEach(p=>{p.ct='tc';PLACES.push(p)});(window.PLACES_TN||[]).forEach(p=>{p.ct='tn';PLACES.push(p)});
const BY={};PLACES.forEach(p=>BY[p.id]=p);
const CITIES={tp:{name:'Taipei',when:'12–15 and 21–24 Nov',center:{lat:25.0478,lng:121.5170},hotel:HOTEL},tc:{name:'Taichung',when:'15–18 Nov',center:{lat:24.1477,lng:120.6736},hotel:window.HOTEL_TC||HOTEL},tn:{name:'Tainan',when:'18–21 Nov',center:{lat:22.9971,lng:120.2127},hotel:window.HOTEL_TN||HOTEL}};
const cityByDate=()=>{const d=new Date(Date.now()+8*3600e3).toISOString().slice(0,10);return d>='2026-11-18'&&d<'2026-11-21'?'tn':d>='2026-11-15'&&d<'2026-11-18'?'tc':'tp'};
const C=()=>CITIES[state.city];
const cityCnt=()=>{const n={};PLACES.forEach(p=>{if(p.ct===state.city)n[p.c]=(n[p.c]||0)+1});return n};
const mq=matchMedia('(min-width:900px)');
const desktop=()=>mq.matches;

const state={city:CITIES[LS.get('city','')]?LS.get('city',''):cityByDate(),cats:new Set(LS.get('cats',[]).filter(c=>CAT[c])),open:false,walk:0,veg:LS.get('veg',false),saved:false,top:false,brinda:false,spec:false,sort:'best',sel:null};
const stars=new Set(LS.get('stars',[]));
let gps=null,manual=LS.get('manual',null),shown=[];

/* ---------- geo + time ---------- */
function dist(a,b){const R=6371000,r=Math.PI/180,x=Math.sin((b.lat-a.lat)*r/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin((b.lng-a.lng)*r/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function origin(){if(manual)return{lat:manual.lat,lng:manual.lng,kind:'pin'};if(gps&&dist(gps,C().center)<60000)return{lat:gps.lat,lng:gps.lng,kind:'gps'};return{lat:C().hotel.lat,lng:C().hotel.lng,kind:'hotel'}}
function tpeNow(){const o={};new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Taipei',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()).forEach(x=>o[x.type]=x.value);return{d:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(o.weekday),m:(+o.hour%24)*60+ +o.minute}}
const hm=s=>{const[a,b]=s.split(':');return +a*60+ +b};
const fmt=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function openInfo(p,now){
  if(!p.h)return null;
  if(p.h==='24h')return{open:true,txt:'Open 24 hours',s:'Open 24h'};
  const x=p.x||[],y=(now.d+6)%7;let next=null;
  for(const r of p.h.split(',')){
    const[a,b]=r.split('-').map(hm),e=b<=a?b+1440:b;
    if(!x.includes(now.d)&&now.m>=a&&now.m<e)return{open:true,txt:'Open now · closes '+fmt(e),s:e-now.m<=45?'Closes '+fmt(e):'Open',soon:e-now.m<=45};
    if(!x.includes(y)&&e>1440&&now.m<e-1440)return{open:true,txt:'Open now · closes '+fmt(e),s:'Open'};
    if(!x.includes(now.d)&&a>now.m&&(next===null||a<next))next=a;
  }
  if(next!==null)return{open:false,txt:'Closed · opens '+fmt(next),s:'Opens '+fmt(next)};
  const t=x.includes(now.d)?'Closed today':'Closed now';return{open:false,txt:t,s:t};
}
const walkTxt=p=>p._w<=60?p._w+' min walk':(p._d/1000).toFixed(1)+' km';
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

const rank=p=>{const f=state.cats.has('cafe')?1:.25;return p._w-(p.p-1)*8-(p.s==='r'?16:p.s==='s'?11:0)*f};
function compute(){
  const o=origin(),now=tpeNow();
  for(const p of PLACES){p._d=dist(o,p)*1.3;p._w=Math.max(1,Math.round(p._d/78));p._o=openInfo(p,now)}
  shown=PLACES.filter(p=>p.ct===state.city&&(!state.cats.size||state.cats.has(p.c))&&(!state.open||(p._o&&p._o.open))&&(!state.walk||p._w<=state.walk)&&(!state.veg||p.c!=='food'||p.v)&&(!state.saved||stars.has(p.id))&&(!state.top||p.p===3)&&(!state.brinda||p.b)&&(!state.spec||p.c!=='cafe'||p.s==='r'||p.s==='s'));
  shown.sort(state.sort==='near'?(a,b)=>a._d-b._d:(a,b)=>rank(a)-rank(b));
}

/* ---------- filters ---------- */
const TOG=[['open','Open now'],['top','Must-see only'],['saved','Saved places'],['spec','Specialty coffee only'],['veg','Vegetarian-friendly food'],['brinda',"Brinda's picks"]];
const SUB={r:'Roaster',s:'Specialty coffee',t:'Tea house'};
const isW=k=>/^w\d+$/.test(k);
const qOn=k=>isW(k)?state.walk===+k.slice(1):!!state[k];
const nActive=()=>state.cats.size+TOG.filter(([k])=>state[k]).length+(state.walk?1:0);
const fp=$('#fp'),cm=$('#cm');
const I_F='<svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.500 5h13M5 9h8M7.500 13h3"/></svg>';
const GROUPS=[['eat','Eat','🍜',['food','sweet','night']],['coffee','Coffee','☕',['cafe']],['see','See','📸',['sight','museum','temple','trip','family']],['books','Books','📚',['book']],['shop','Shop','🛍️',['shop']],['active','Active','🏃',['nature','run','swim','spring']]];
function renderFilters(){
  const cnt=cityCnt(),row=$('#catRow'),sub=$('#subRow'),chip=([id,l,e,c])=>`<button class="chip${state.cats.has(id)?' on':''}" style="--c:${c}" data-cat="${id}">${e} ${l}</button>`;
  const open=`<button class="chip${state.open?' on':''}" data-q="open">Open now</button>`;
  $('#cityName').textContent=C().name;
  if(desktop()){
    const n=nActive();row.className='row';sub.hidden=true;
    row.innerHTML=`<button class="chip fbtn" id="fOpen" aria-label="Filters">${I_F}${n?`<i>${n}</i>`:'Filters'}</button>`+open+CATS.filter(c=>cnt[c[0]]).map(chip).join('');
  }else{
    const n=nActive()-state.cats.size,act=GROUPS.filter(g=>g[3].some(c=>state.cats.has(c)));
    row.className='bar';
    row.innerHTML=GROUPS.map(g=>`<button class="g${act.includes(g)?' on':''}" data-g="${g[0]}"><span>${g[2]}</span>${g[1]}</button>`).join('')+`<button class="g" id="fOpen"><span>${I_F}</span>Filters${n?`<i>${n}</i>`:''}</button>`;
    const ids=[].concat(...act.map(g=>g[3])).filter(c=>cnt[c]);
    sub.hidden=!act.length;
    sub.innerHTML=act.length?open+(ids.includes('cafe')?`<button class="chip${state.spec?' on':''}" data-q="spec">Specialty only</button>`:'')+(ids.length>1?CATS.filter(c=>ids.includes(c[0])).map(chip).join(''):''):'';
    document.documentElement.style.setProperty('--sub',act.length?'46px':'0px');
  }
  if(fp.classList.contains('open'))syncPanel();
}
function renderPanel(){
  const cnt=cityCnt();
  $('#fpBody').innerHTML='<h3>Categories</h3><div class="grid">'+CATS.filter(c=>cnt[c[0]]).map(([id,l,e,c])=>`<button class="tile" style="--c:${c}" data-cat="${id}"><span>${e}</span>${l}<small>${cnt[id]}</small></button>`).join('')+'</div><h3>Walking time</h3><div class="seg">'+[0,10,20,30].map(n=>`<button data-q="w${n}">${n?n+' min':'Any'}</button>`).join('')+'</div><h3>Show</h3><div class="tgs">'+TOG.filter(([k])=>k!=='brinda'||state.city==='tp').map(([k,l])=>`<button class="tg" data-q="${k}"><span>${l}</span><i></i></button>`).join('')+'</div>';
  syncPanel();
}
function syncPanel(){
  document.querySelectorAll('#fpBody [data-q]').forEach(b=>b.classList.toggle('on',qOn(b.dataset.q)));
  document.querySelectorAll('#fpBody [data-cat]').forEach(b=>b.classList.toggle('on',state.cats.has(b.dataset.cat)));
  $('#fpGo').textContent=shown.length?'Show '+shown.length+(shown.length===1?' place':' places'):'No places match';
}
function onFilterClick(e){
  if(e.target.closest('#fOpen')){renderPanel();fp.classList.add('open');return}
  const b=e.target.closest('[data-cat],[data-q],[data-g]');if(!b)return;
  if('g' in b.dataset){const cnt=cityCnt(),cs=GROUPS.find(x=>x[0]===b.dataset.g)[3].filter(c=>cnt[c]),on=cs.some(c=>state.cats.has(c));state.cats.clear();if(!on)cs.forEach(c=>state.cats.add(c));if(!state.cats.has('cafe'))state.spec=false}
  else if('cat' in b.dataset){const c=b.dataset.cat;state.cats.has(c)?state.cats.delete(c):state.cats.add(c)}
  else{const k=b.dataset.q;if(isW(k)){const n=+k.slice(1);state.walk=state.walk===n?0:n}else state[k]=!state[k]}
  LS.set('cats',[...state.cats]);LS.set('veg',state.veg);closeDetail(true);refresh(true);
}
['#catRow','#subRow','#fpBody'].forEach(q=>$(q).addEventListener('click',onFilterClick));
$('#fpGo').onclick=$('#fpX').onclick=()=>fp.classList.remove('open');
fp.addEventListener('click',e=>{if(e.target===fp)fp.classList.remove('open')});
$('#fpClr').onclick=()=>clearFilters();
function clearFilters(){state.cats.clear();state.open=state.saved=state.top=state.brinda=state.veg=state.spec=false;state.walk=0;LS.set('cats',[]);LS.set('veg',false);refresh(true)}

/* ---------- list ---------- */
const catLabel=p=>SUB[p.s]||CAT[p.c].label;
function card(p){const c=CAT[p.c],o=p._o;
  return `<button class="card" data-id="${p.id}"><span class="ico" style="--c:${c.color}">${c.emoji}</span><span class="cb"><span class="cn">${esc(p.n)}${stars.has(p.id)?' <i class="st">★</i>':''}</span><span class="cm">${walkTxt(p)} · ${catLabel(p)}${o?` · <b class="${o.open&&!o.soon?'op':'cl'}">${o.s}</b>`:''}</span><span class="ck">${esc(p.k)}</span><span class="cx">${esc(p.z)} · ${esc(p.a)}${p.m?' · '+esc(p.m):''}${p.t?' · allow '+dur(p.t):''}</span></span></button>`}
const dur=t=>t<60?t+' min':(Math.round(t/30)/2)+' h';

  $('#originTxt').textContent=n+(n===1?' place':' places')+' · '+(o.kind==='gps'?'from where you are':o.kind==='pin'?'from your dropped pin':gps?'you are outside '+C().name+', so from your hotel':gpsDenied?'from your hotel · location is off':'from your hotel');

$('#sortBtn').addEventListener('click',e=>{e.stopPropagation();state.sort=state.sort==='best'?'near':'best';refresh(true)});
$('#sortBtn').addEventListener('pointerdown',e=>e.stopPropagation());

/* ---------- detail ---------- */
const PRICE=['Free','Under NT$200','NT$200–600','NT$600–1,500','NT$1,500+'],PSHORT=['Free','$','$$','$$$','$$$$'];
const I_X='<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1.500 1.500l9 9M10.500 1.500l-9 9"/></svg>';
const I_PIN='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 21s7-6.200 7-11.200a7 7 0 1 0-14 0C5 14.800 12 21 12 21z"/><circle cx="12" cy="9.800" r="2.400"/></svg>';
function renderDetail(p){const c=CAT[p.c],o=p._o,far=p._w>35,sv=stars.has(p.id);
  const dir=`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=${far?'transit':'walking'}`;
  const gm=`https://www.google.com/maps/search/${encodeURIComponent(p.z)}/@${p.lat},${p.lng},17z`;
  const closed=(p.x||[]).length?'Closed '+p.x.map(d=>DAYS[d]).join(', '):'';
  const km=p._d<950?Math.round(p._d/10)*10+' m':(p._d/1000).toFixed(1)+' km';
  $('#detail').innerHTML=`<div class="dtop"><div><h2>${esc(p.n)}</h2>${p.z!==p.n?`<div class="zh">${esc(p.z)}</div>`:''}<div class="dsub">${catLabel(p)} · ${esc(p.a)}${p.p===3?' · Must-see':''}${p.b?' · Brinda':''}</div></div><button class="x" id="back" aria-label="Close">${I_X}</button></div>
  <div class="acts"><a class="btn pri" href="${dir}" target="_blank" rel="noopener"><b>Directions</b><span>${far?km+' · transit':walkTxt(p)}</span></a><a class="btn" href="${gm}" target="_blank" rel="noopener">${I_PIN}<span>Maps</span></a><button class="btn" id="starBtn"><span class="star">${sv?'★':'☆'}</span><span>${sv?'Saved':'Save'}</span></button></div>
  <div class="stats"><div><small>Hours</small><b class="${o?(o.open?'op':'cl'):''}">${o?(o.open?'Open':'Closed'):'Check'}</b></div><div><small>Distance</small><b>${km}</b></div><div><small>Allow</small><b>${dur(p.t)}</b></div>${p.pr!=null?`<div><small>Cost</small><b>${PSHORT[p.pr]}</b></div>`:''}</div>
  <div class="grp"><p>${esc(p.k)}</p></div>
  ${p.tip?`<div class="grp"><h4>Good to know</h4><p>${esc(p.tip)}</p></div>`:''}
  <div class="grp kv">
   <div><span>Hours</span><span>${o?(p.h==='24h'?'Always open':esc(p.h.replace(/,/g,', ').replace(/-/g,'–'))+(closed?'<br>'+closed:'')):'Not listed'}</span></div>
   ${o&&p.h!=='24h'?`<div><span>Now</span><span class="${o.open?'op':'cl'}">${o.txt}</span></div>`:''}
   ${p.m?`<div><span>Station</span><span>${esc(p.m)}</span></div>`:''}
   ${p.pr!=null?`<div><span>Cost</span><span>${PRICE[p.pr]}</span></div>`:''}
  </div>
  <p class="fine">Hours and prices are a guide and may have changed.</p>`;
}
$('#detail').addEventListener('click',e=>{
  if(e.target.closest('#back'))closeDetail();
  if(e.target.closest('#starBtn')){const id=state.sel;stars.has(id)?stars.delete(id):stars.add(id);LS.set('stars',[...stars]);const t=$('#detail').scrollTop;renderDetail(BY[id]);$('#detail').scrollTop=t;renderList()}
});
function select(id){const p=BY[id];if(!p)return;state.sel=id;renderDetail(p);$('#detail').scrollTop=0;$('#list').hidden=true;$('#detail').hidden=false;sheet.classList.add('det');
  if(!desktop()&&sheetState!=='half')setSheet('half');
  setSel(p);if(map)map.easeTo({center:[p.lng,p.lat],zoom:Math.max(map.getZoom(),15),padding:pad(),duration:500});}
function closeDetail(quiet){if(state.sel==null)return;state.sel=null;$('#detail').hidden=true;$('#list').hidden=false;sheet.classList.remove('det');setSel(null)}
addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});

/* ---------- bottom sheet (mobile) ---------- */
const sheet=$('#sheet'),head=$('#sheetHead');let snaps={full:0,half:0,peek:0},sheetState='half',sheetY=0;
function layout(){
  if(desktop()){document.documentElement.style.setProperty('--top','0px');sheet.style.transform='';$('#list').style.paddingBottom=$('#detail').style.paddingBottom='';return}
  document.documentElement.style.setProperty('--top',$('#filters').offsetHeight+'px');
  const H=sheet.offsetHeight;snaps={full:0,half:Math.round(H*.5),peek:H-head.offsetHeight-24};setSheet(sheetState,false);
}
function applyY(y,anim){sheetY=y;sheet.style.transition=anim?'transform .42s cubic-bezier(.32,.72,0,1)':'none';sheet.style.transform=`translate3d(0,${y}px,0)`}
function setSheet(st,anim=true){sheetState=st;applyY(snaps[st],anim);const pb=`calc(${snaps[st]}px + env(safe-area-inset-bottom) + 16px)`;$('#list').style.paddingBottom=pb;$('#detail').style.paddingBottom=pb}
function pad(){return desktop()?{top:0,bottom:0,left:0,right:0}:{top:$('#filters').offsetHeight,bottom:Math.max(0,sheet.offsetHeight-snaps[sheetState==='full'?'half':sheetState]),left:0,right:0}}
let drag=null;
head.addEventListener('pointerdown',e=>{if(desktop())return;drag={y:e.clientY,s:sheetY,t:e.timeStamp,ly:e.clientY,lt:e.timeStamp,v:0,moved:false};head.setPointerCapture(e.pointerId)});
head.addEventListener('pointermove',e=>{if(!drag)return;const dy=e.clientY-drag.y;if(Math.abs(dy)>6)drag.moved=true;const dt=e.timeStamp-drag.lt;if(dt>0)drag.v=(e.clientY-drag.ly)/dt;drag.ly=e.clientY;drag.lt=e.timeStamp;applyY(Math.min(snaps.peek,Math.max(0,drag.s+dy)),false)});
const endDrag=()=>{if(!drag)return;const d=drag;drag=null;
  if(!d.moved){setSheet(sheetState==='peek'?'half':sheetState==='half'?'full':'half');return}
  const order=['full','half','peek'];let best='half';
  if(Math.abs(d.v)>.45){const i=order.indexOf(order.reduce((a,b)=>Math.abs(snaps[a]-d.s)<Math.abs(snaps[b]-d.s)?a:b));best=order[Math.min(2,Math.max(0,i+(d.v>0?1:-1)))]}
  else best=order.reduce((a,b)=>Math.abs(snaps[a]-sheetY)<Math.abs(snaps[b]-sheetY)?a:b);
  setSheet(best)};
head.addEventListener('pointerup',endDrag);head.addEventListener('pointercancel',endDrag);
addEventListener('resize',layout);mq.addEventListener('change',()=>{renderFilters();layout();map&&map.resize()});

/* ---------- map ---------- */
let map=null,mapReady=false,meMarker=null,pinMarker=null,hotelMarker=null;
const fc=a=>({type:'FeatureCollection',features:a.map(p=>({type:'Feature',geometry:{type:'Point',coordinates:[p.lng,p.lat]},properties:{id:p.id,n:p.n,p:p.p,color:CAT[p.c].color}}))});
function setSel(p){if(mapReady)map.getSource('sel').setData(fc(p?[p]:[]))}
function el(cls,txt){const d=document.createElement('div');d.className=cls;if(txt)d.textContent=txt;return d}
function initMap(){
  if(!window.maplibregl){toast('Map could not load. The list still works.');return}
  const o=origin();
  map=new maplibregl.Map({container:'map',style:STYLE,center:[o.lng,o.lat],zoom:14,minZoom:8.5,maxZoom:18,maxBounds:[[119.8,22.4],[122.5,25.7]],attributionControl:false,dragRotate:false,pitchWithRotate:false,fadeDuration:120});
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.AttributionControl({compact:true}),'top-left');
  map.setPadding(pad());
  const hp=el('hpin');hp.innerHTML='<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M1.500 3.500v9h1.500v-2h10v2h1.500V8.300a2.300 2.300 0 0 0-2.300-2.300H7.500v3H3V3.500z"/><circle cx="5" cy="7" r="1.500"/></svg>';
  hotelMarker=new maplibregl.Marker({element:hp}).setLngLat([C().hotel.lng,C().hotel.lat]).addTo(map);
  meMarker=new maplibregl.Marker({element:el('me')});
  pinMarker=new maplibregl.Marker({element:el('pin','📍'),anchor:'bottom'});
  if(manual)pinMarker.setLngLat([manual.lng,manual.lat]).addTo(map);
  if(gps)meMarker.setLngLat([gps.lng,gps.lat]).addTo(map);
  map.on('load',()=>{
    map.addSource('pl',{type:'geojson',data:fc(shown)});
    map.addSource('sel',{type:'geojson',data:fc(state.sel?[BY[state.sel]]:[])});
    map.addLayer({id:'pl-dot',type:'circle',source:'pl',paint:{'circle-color':['get','color'],'circle-stroke-color':'#fff','circle-stroke-width':['interpolate',['linear'],['zoom'],11,1,14,2],'circle-radius':['interpolate',['linear'],['zoom'],10,['match',['get','p'],3,4,2.5],14,['match',['get','p'],3,8.5,2,7,6],17,12]}});
    map.addLayer({id:'pl-sel',type:'circle',source:'sel',paint:{'circle-color':['get','color'],'circle-radius':14,'circle-stroke-color':'#16181d','circle-stroke-width':3}});
    map.addLayer({id:'pl-lab',type:'symbol',source:'pl',minzoom:13.2,layout:{'text-field':['get','n'],'text-font':['Noto Sans Bold'],'text-size':11.5,'text-anchor':'top','text-offset':[0,1],'text-max-width':9,'text-optional':true,'symbol-sort-key':['-',4,['get','p']]},paint:{'text-color':'#16181d','text-halo-color':'#fff','text-halo-width':1.6}});
    mapReady=true;const at=document.querySelector('.maplibregl-ctrl-attrib');if(at){at.classList.remove('maplibregl-compact-show');at.removeAttribute('open')}
  });
  map.on('click',e=>{const r=18,f=map.queryRenderedFeatures([[e.point.x-r,e.point.y-r],[e.point.x+r,e.point.y+r]],{layers:['pl-dot']});
    if(!f.length){if(state.sel)closeDetail();return}
    let best=f[0],bd=1e9;for(const x of f){const q=map.project(x.geometry.coordinates),d=(q.x-e.point.x)**2+(q.y-e.point.y)**2;if(d<bd){bd=d;best=x}}
    select(best.properties.id)});
  map.on('mouseenter','pl-dot',()=>map.getCanvas().style.cursor='pointer');
  map.on('mouseleave','pl-dot',()=>map.getCanvas().style.cursor='');
  map.on('contextmenu',e=>setManual(e.lngLat));
  let lp=null,lpPt=null;const cancel=()=>{clearTimeout(lp);lp=null};
  map.on('touchstart',e=>{cancel();if(e.originalEvent.touches.length>1)return;const ll=e.lngLat;lpPt=e.point;lp=setTimeout(()=>{setManual(ll);navigator.vibrate&&navigator.vibrate(12)},650)});
  map.on('touchmove',e=>{if(lp&&lpPt&&Math.hypot(e.point.x-lpPt.x,e.point.y-lpPt.y)>8)cancel()});
  map.on('touchend',cancel);map.on('touchcancel',cancel);
}
function setManual(ll){manual={lat:ll.lat,lng:ll.lng};LS.set('manual',manual);pinMarker.setLngLat([ll.lng,ll.lat]).addTo(map);toast('Measuring from this pin');refresh(true)}
function setCity(c,quiet){
  if(!CITIES[c]||c===state.city)return;
  state.city=c;LS.set('city',c);state.cats.clear();LS.set('cats',[]);
  if(manual){manual=null;LS.set('manual',null);pinMarker&&pinMarker.remove()}
  closeDetail(true);refresh(true);offState();
  if(hotelMarker)hotelMarker.setLngLat([C().hotel.lng,C().hotel.lat]);
  const o=origin();map&&map.jumpTo({center:[o.lng,o.lat],zoom:14,padding:pad()});
  if(!quiet)toast(C().name);
}
function refresh(scrollTop){compute();renderFilters();renderList();if(scrollTop)$('#list').scrollTop=0;if(mapReady)map.getSource('pl').setData(fc(shown));else if(map)map.once('load',()=>map.getSource('pl').setData(fc(shown)));if(state.sel)renderDetail(BY[state.sel])}

/* ---------- location ---------- */
let watchId=null,gpsDenied=false,gpsCity=null;
const LOC_HELP='Location is blocked. On iPhone: Settings → Privacy & Security → Location Services → Safari Websites → While Using the App. Then close and reopen this app.';
function onPos(pos){
  const n={lat:pos.coords.latitude,lng:pos.coords.longitude},first=!gps,moved=!gps||dist(gps,n)>25;gps=n;gpsDenied=false;
  const gc=Object.keys(CITIES).filter(k=>dist(n,CITIES[k].center)<60000).sort((a,b)=>dist(n,CITIES[a].center)-dist(n,CITIES[b].center))[0]||null;
  if(gc&&gc!==gpsCity){gpsCity=gc;if(gc!==state.city)setCity(gc)}
  if(meMarker&&map)meMarker.setLngLat([n.lng,n.lat]).addTo(map);
  if(moved)refresh(false);
  if(first&&map&&origin().kind==='gps')map.easeTo({center:[n.lng,n.lat],zoom:15,padding:pad(),duration:600});
}
function startGPS(byUser){
  const G=navigator.geolocation;
  if(!G){byUser&&toast('This device has no location service');return}
  if(watchId!=null){G.clearWatch(watchId);watchId=null}
  const fail=err=>{
    if(err.code===1){gpsDenied=true;if(!isSecureContext){toast('This icon was saved from an insecure address. Delete it and add it again from Safari.',9000);return}if(watchId!=null){G.clearWatch(watchId);watchId=null}renderList();if(byUser)toast(LOC_HELP,9000)}
    else if(byUser&&!gps)toast('Still looking for your location. Try near a window or outdoors.',5000);
  };
  // Quick coarse fix first (works indoors), then a precise live watch.
  G.getCurrentPosition(onPos,fail,{enableHighAccuracy:false,maximumAge:60000,timeout:15000});
  watchId=G.watchPosition(onPos,err=>{if(err.code===1)fail(err)},{enableHighAccuracy:true,maximumAge:5000});
}
$('#locBtn').addEventListener('click',()=>{
  if(manual){manual=null;LS.set('manual',null);pinMarker.remove();refresh(true)}
  if(!gps){startGPS(true);const o=origin();map&&map.easeTo({center:[o.lng,o.lat],zoom:14.5,padding:pad()});return}
  const o=origin();if(o.kind!=='gps')toast("You're outside "+C().name+", so I'm measuring from your hotel");
  map&&map.easeTo({center:[o.lng,o.lat],zoom:15,padding:pad(),duration:600});
});

/* ---------- offline ---------- */
let downloading=false;
const offBtn=$('#offBtn'),offLbl=offBtn.querySelector('small');
const offKey=()=>state.city==='tp'?'offline':'offline_'+state.city;
function offState(){if(downloading)return;const o=LS.get(offKey(),null);offBtn.classList.toggle('done',!!o);offLbl.hidden=!o;if(o)offLbl.textContent='✓'}
const lon2x=(l,z)=>Math.floor((l+180)/360*2**z),lat2y=(l,z)=>Math.floor((1-Math.log(Math.tan(l*Math.PI/180)+1/Math.cos(l*Math.PI/180))/Math.PI)/2*2**z);
const AREAS={tp:[[[121.30,24.80,121.95,25.30],[9,10,11,12]],[[121.42,24.94,121.63,25.20],[13,14]],[[121.80,25.08,121.87,25.13],[13,14]],[[121.75,25.02,121.80,25.06],[13,14]],[[121.67,25.19,121.71,25.22],[13,14]],[[121.53,24.84,121.57,24.88],[13,14]],[[121.72,25.11,121.77,25.15],[13,14]],[[121.40,25.15,121.46,25.20],[13,14]]],
 tn:[[[119.95,22.75,120.60,23.40],[9,10,11,12]],[[120.14,22.92,120.26,23.03],[13,14]],[[120.12,23.01,120.15,23.03],[13,14]],[[120.22,23.05,120.25,23.07],[13,14]],[[120.07,23.19,120.10,23.22],[13,14]],[[120.49,23.32,120.52,23.35],[13,14]]],
 tc:[[[120.35,23.75,121.10,24.40],[9,10,11,12]],[[120.58,24.10,120.72,24.20],[13,14]],[[120.53,24.29,120.57,24.33],[13,14]],[[120.67,24.03,120.72,24.08],[13,14]],[[120.41,24.04,120.45,24.07],[13,14]],[[120.89,23.84,120.94,23.89],[13,14]],[[120.72,24.17,120.76,24.20],[13,14]],[[120.79,24.19,120.83,24.22],[13,14]]]};
async function downloadOffline(){
  if(downloading)return;const city=state.city,key=offKey(),cname=C().name;
  if(!('serviceWorker' in navigator)){toast('Offline saving needs the app opened over https');return}
  if(!navigator.onLine){toast('Connect to Wi-Fi first to save the map');return}
  downloading=true;offLbl.hidden=false;offBtn.classList.remove('done');offLbl.textContent='0%';
  try{
    await navigator.serviceWorker.ready;
    if(!navigator.serviceWorker.controller)await new Promise(r=>{navigator.serviceWorker.addEventListener('controllerchange',r,{once:true});setTimeout(r,3000)});
    navigator.storage&&navigator.storage.persist&&navigator.storage.persist();
    const style=await(await fetch(STYLE)).json();
    const src=Object.values(style.sources).find(s=>s.type==='vector');
    const tj=await(await fetch(src.url)).json(),tpl=tj.tiles[0],urls=new Set();
    for(const[b,zs]of AREAS[city])for(const z of zs)for(let x=lon2x(b[0],z);x<=lon2x(b[2],z);x++)for(let y=lat2y(b[3],z);y<=lat2y(b[1],z);y++)urls.add(tpl.replace('{z}',z).replace('{x}',x).replace('{y}',y));
    const fonts=new Set();style.layers.forEach(l=>l.layout&&Array.isArray(l.layout['text-font'])&&l.layout['text-font'].forEach(f=>typeof f==='string'&&fonts.add(f)));fonts.add('Noto Sans Bold');
    for(const f of fonts)for(const r of['0-255','256-511','768-1023','8192-8447','12288-12543','65024-65279','65280-65535'])urls.add(style.glyphs.replace('{fontstack}',encodeURIComponent(f)).replace('{range}',r));
    if(typeof style.sprite==='string')for(const s of['.json','.png','@2x.json','@2x.png'])urls.add(style.sprite+s);
    const q=[...urls],total=q.length;let done=0,bytes=0,fail=0;
    await Promise.all(Array.from({length:8},async()=>{while(q.length){const u=q.pop();try{const r=await fetch(u);if(r.ok)bytes+=(await r.blob()).size;else if(r.status!==404&&r.status!==204)fail++}catch(e){fail++}done++;if(done%5===0||done===total)offLbl.textContent=Math.round(done/total*100)+'%'}}));
    if(fail>total*.05){toast(`Saved with ${fail} gaps. Tap ⬇ again on better Wi-Fi.`);offLbl.textContent='!'}
    else{LS.set(key,{at:Date.now(),mb:+(bytes/1e6).toFixed(1)});downloading=false;offState();toast(`${cname} map saved for offline use (${(bytes/1e6).toFixed(0)} MB)`)}
  }catch(e){toast('Could not save the map. Check your connection and try again.');offLbl.hidden=true}
  downloading=false;offState();
}
offBtn.addEventListener('click',()=>{const o=LS.get(offKey(),null);if(o&&!downloading&&!confirm('The '+C().name+' map is already saved. Download it again?'))return;downloadOffline()});

/* ---------- misc ---------- */
let toastT;function toast(t,ms){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),ms||3200)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
compute();renderFilters();renderList();layout();initMap();offState();startGPS(false);
setInterval(()=>{if(!document.hidden&&state.sel==null)refresh(false)},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){refresh(false);if(!gpsDenied)startGPS(false)}});
</script>
</body>
