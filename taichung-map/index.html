<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16303a"><style>:root{padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style></head><body><title>Taichung Layout Map</title>

<style>
/* Layout: a survey-style map fills the screen; a side sheet (bottom sheet on phones) explains whatever is selected. Zones are highlighter washes, pins are coloured by kind. */
:root{
  --land:#eceee6; --land2:#e3e7dc; --paper:#f8f9f4; --ink:#16303a; --sub:#55686e; --line:#cdd4cb;
  --road:#ffffff; --fwy:#b9b3c9; --spine:#ee7b4d; --water:#a6cadb; --park:#c9ddb6; --green:#5fa862;
  --mrt:#1f9d57; --hsr:#b0621a; --zone:#f5c400; --zone-o:.30; --zone-on:.62;
  --c-sights:#6741d9; --c-eat:#d9480f; --c-cafe:#7f5539; --c-books:#1864ab; --c-night:#a61e4d; --c-out:#2b8a3e;
  --display:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --land:#1b2327; --land2:#20292d; --paper:#141b1e; --ink:#e7eeed; --sub:#9db0b3; --line:#34424a;
  --road:#33414a; --fwy:#5b5670; --spine:#e8794e; --water:#1d4558; --park:#263a28; --green:#4f9a55;
  --mrt:#3ecb7c; --hsr:#e09a4f; --zone:#f5c400; --zone-o:.17; --zone-on:.40;
  --c-sights:#b197fc; --c-eat:#ffa94d; --c-cafe:#d9ad84; --c-books:#74c0fc; --c-night:#f783ac; --c-out:#8ce99a;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --land:#1b2327; --land2:#20292d; --paper:#141b1e; --ink:#e7eeed; --sub:#9db0b3; --line:#34424a;
  --road:#33414a; --fwy:#5b5670; --spine:#e8794e; --water:#1d4558; --park:#263a28; --green:#4f9a55;
  --mrt:#3ecb7c; --hsr:#e09a4f; --zone:#f5c400; --zone-o:.17; --zone-on:.40;
  --c-sights:#b197fc; --c-eat:#ffa94d; --c-cafe:#d9ad84; --c-books:#74c0fc; --c-night:#f783ac; --c-out:#8ce99a;
  color-scheme:dark }
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;display:flex;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.mapwrap{position:relative;flex:1 1 auto;min-width:0;min-height:0;background:var(--land);overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.drag{cursor:grabbing}
.panel{flex:0 0 400px;max-width:44%;overflow-y:auto;border-left:1px solid var(--line);padding-block:20px 28px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));min-width:0}
@media (max-width:760px){
  body{flex-direction:column}
  .mapwrap{flex:1 1 52%}
  .panel{flex:0 0 48%;max-width:none;border-left:0;border-top:1px solid var(--line);padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
/* map layers */
.ns{vector-effect:non-scaling-stroke;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dist{fill:var(--land);stroke:var(--sub);stroke-width:1px;stroke-dasharray:1 4;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.dist.alt{fill:var(--land2)}
#parks{fill:var(--park)} #water{stroke:var(--water);stroke-width:var(--ww)}
#rf{stroke:var(--fwy);stroke-width:var(--wf)} #rs{stroke:var(--road);stroke-width:var(--ws)} #rp{stroke:var(--road);stroke-width:var(--wp)}
#tb{stroke:var(--spine);stroke-width:var(--wt)}
#gway{stroke:var(--green);stroke-width:var(--wg);opacity:.75}
#tra1{stroke:var(--ink);stroke-width:3px} #tra2{stroke:var(--land);stroke-width:1.4px;stroke-dasharray:6 6;stroke-linecap:butt}
#hsr{stroke:var(--hsr);stroke-width:3px;stroke-dasharray:9 4;stroke-linecap:butt} #mrt{stroke:var(--mrt);stroke-width:3.2px}
.zone path{fill:var(--zone);stroke:var(--zone);stroke-linejoin:round;stroke-linecap:round}
.zone{opacity:var(--zone-o);transition:opacity .2s}
.zone.on{opacity:var(--zone-on)} .zone.dim{opacity:.07}
.ring{fill:none;stroke:var(--ink);stroke-width:1px;stroke-dasharray:3 4;vector-effect:non-scaling-stroke;opacity:.55}
#route{fill:none;stroke:var(--ink);stroke-width:2px;stroke-dasharray:2 5;vector-effect:non-scaling-stroke;stroke-linecap:round}
text{font-family:var(--body);fill:var(--ink)}
.halo{paint-order:stroke;stroke:var(--land);stroke-width:3.5px;stroke-linejoin:round}
.dlab{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.2em;fill:var(--sub);opacity:.75;text-anchor:middle}
.dlab tspan{font-family:var(--body);font-weight:400;font-size:10px;letter-spacing:.05em}
.rlab{font-size:10px;fill:var(--sub);text-anchor:middle}
.slab{font-size:10.5px;font-weight:500}
.ringlab{font-family:var(--mono);font-size:10px;text-anchor:middle;fill:var(--sub)}
.plab{font-size:11.5px;font-weight:500}
.pin circle.dot{stroke:var(--land);stroke-width:1.5px}
.pin.dim{opacity:.22}
.halo2{fill:none;stroke:none}
[hidden]{display:none!important}
.pin.sel circle.halo2{fill:none;stroke:var(--ink);stroke-width:2px}
.g-sights .dot{fill:var(--c-sights)} .g-eat .dot{fill:var(--c-eat)} .g-cafe .dot{fill:var(--c-cafe)} .g-books .dot{fill:var(--c-books)} .g-night .dot{fill:var(--c-night)} .g-out .dot{fill:var(--c-out)}
.zlab rect{fill:var(--ink)} .zlab text{fill:var(--paper);font-family:var(--display);font-weight:600;font-size:12px;text-anchor:middle}
.zlab,.pin{cursor:pointer}
.hotel rect{fill:var(--ink);stroke:var(--land);stroke-width:2px} .hotel text{font-weight:600;font-size:12px}
.st-m{fill:var(--land);stroke:var(--mrt);stroke-width:2px} .st-t{fill:var(--land);stroke:var(--ink);stroke-width:2px} .st-h{fill:var(--hsr);stroke:var(--land);stroke-width:2px}
/* floating controls */
.chips{position:absolute;top:0;left:0;right:0;display:flex;gap:6px;overflow-x:auto;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chip i{width:9px;height:9px;border-radius:50%;flex:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.zoom button{width:38px;height:38px;text-align:center;font-size:19px;line-height:1}
.zoom button+button{border-top:1px solid var(--line)}
.zoom svg{width:17px;height:17px;vertical-align:-3px}
.scale{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;font-family:var(--mono);font-size:10.5px;color:var(--sub);pointer-events:none}
.scale b{display:block;height:5px;border:1.5px solid var(--sub);border-top:0;margin-bottom:2px}
.credit{position:absolute;left:50%;transform:translateX(-50%);bottom:3px;font-size:9.5px;color:var(--sub);opacity:.8;pointer-events:none;white-space:nowrap}
/* panel */
h1{font-family:var(--display);font-size:26px;line-height:1.1;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--display);font-size:22px;line-height:1.15;font-weight:700;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);margin:22px 0 8px}
.lede{color:var(--sub);margin:6px 0 0}
.zh{color:var(--sub);font-size:14px;margin-top:2px}
.seg{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.seg button{padding:7px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);width:100%;align-items:baseline}
.row:last-child{border-bottom:1px solid var(--line)}
.row b{font-weight:600} .row .m{font-family:var(--mono);font-size:12px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.row span.d{grid-column:1/-1;color:var(--sub);font-size:13.5px}
.row:hover b{text-decoration:underline}
.row .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.note{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:9px 0;width:100%;align-items:start}
.note svg{width:22px;height:14px;margin-top:4px}
.note b{font-weight:600}
.note:hover b{text-decoration:underline}
.back{font-size:13.5px;color:var(--sub);margin-bottom:12px;font-weight:500}
.back:hover{color:var(--ink)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0 0;font-size:14px}
.facts dt{color:var(--sub)} .facts dd{margin:0}
.warn{margin-top:12px;padding:10px 12px;border:1px dashed var(--ink);border-radius:8px;font-size:13.5px}
.step{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);width:100%}
.step i{font-style:normal;font-family:var(--mono);font-size:12px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.step small{display:block;color:var(--sub);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.step:hover b{text-decoration:underline}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{padding:9px 14px;border-radius:8px;border:1px solid var(--ink);font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--paper)}
.arrow{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:6px}
.fine{font-size:12px;color:var(--sub);margin-top:18px}
@media (prefers-reduced-motion:reduce){.zone{transition:none}}
</style>

anical garden next door is free.","h":"09:00-17:00","x":[1],"t":150},{"id":"tc_botanic","n":"NMNS Botanical Garden","z":"自然科學博物館植物園","c":"nature","lat":24.159,"lng":120.668,"p":2,"k":"A free garden of Taiwan's plant zones around a tall glass rainforest greenhouse.","tip":"The greenhouse has a small ticket; the outdoor garden does not.","h":"09:00-17:00","x":[1],"t":60},{"id":"tc_theater","n":"National Taichung Theater","z":"臺中國家歌劇院","c":"sight","lat":24.16293,"lng":120.64052,"p":3,"k":"Toyo Ito's opera house of curved concrete caves, with a free rooftop garden and an atrium café.","tip":"Go up to the sky garden on the 6th floor, then stay for the lit-up façade at dusk.","h":"11:30-21:00","x":[1],"t":75,"m":"Taichung City Hall"},{"id":"tc_maple","n":"Maple Garden","z":"秋紅谷景觀生態公園","c":"nature","lat":24.16857,"lng":120.63905,"p":1,"k":"A sunken lake park among the Xitun towers, at its best lit up in the evening.","tip":"Ten minutes on foot from the National Taichung Theater.","h":"24h","t":40,"m":"Taichung City Hall"},{"id":"tc_tcpark","n":"Taichung Park","z":"臺中公園","c":"nature","lat":24.14413,"lng":120.68412,"p":2,"k":"The city's oldest park, with a 1908 twin-roofed lake pavilion that is Taichung's emblem.","tip":"Rowing boats on the lake by day; combine with Yizhong Street to the north.","h":"24h","t":45},{"id":"tc_liuchuan","n":"Liuchuan Riverside Walk","z":"柳川水岸步道","c":"nature","lat":24.14355,"lng":120.67758,"p":2,"k":"A restored canal with planted banks and low bridges; prettiest after dark.","tip":"Runs beside Zhonghua Road Night Market, so walk it before eating.","h":"24h","t":30},{"id":"tc_lvchuan","n":"Green Waterway","z":"綠川水岸廊道","c":"nature","lat":24.1385,"lng":120.6845,"p":1,"k":"The old station-front canal reopened as a short waterside promenade.","tip":"Two minutes from Miyahara and the old station.","h":"24h","t":25},{"id":"tc_station","n":"Old Taichung Station","z":"臺中驛鐵道文化園區","c":"sight","lat":24.13673,"lng":120.68512,"p":2,"k":"The red-brick 1917 station kept beside the new elevated one, with old platforms to wander.","h":"24h","t":30},{"id":"tc_miyahara","n":"Miyahara","z":"宮原眼科","c":"sweet","lat":24.13785,"lng":120.68357,"p":3,"k":"A 1927 eye clinic rebuilt as a towering library-like sweet shop, famous for ice cream with toppings.","tip":"The ice cream window queues outside; the shop itself is free to walk through.","h":"10:00-21:00","t":45},{"id":"tc_fourth","n":"Fourth Credit Union","z":"第四信用合作社","c":"sweet","lat":24.13899,"lng":120.68199,"p":2,"k":"Miyahara's sister shop in an old bank, vault door intact, serving ice cream and waffles with seats.","tip":"Go here if you want to sit; Miyahara is mostly takeaway.","h":"10:00-21:00","t":45},{"id":"tc_central","n":"Central Bookstore","z":"中央書局","c":"book","lat":24.14079,"lng":120.68123,"p":3,"k":"The 1927 bookshop that was the meeting room of Taiwan's cultural movement, restored over three floors with a café.","tip":"Closed Tuesdays. The top-floor café is a quiet place to read.","h":"11:00-19:00","x":[2],"t":60},{"id":"tc_market2","n":"Second Market","z":"第二市場","c":"food","lat":24.14294,"lng":120.67995,"p":3,"k":"A 1917 hexagonal market of breakfast legends: braised pork rice, radish cake, wonton noodles and red tea.","tip":"Go before 11:00; many stalls shut by early afternoon. Wang's radish cake with egg is meat-free.","h":"07:00-15:00","t":60},{"id":"tc_market5","n":"Fifth Market","z":"第五市場","c":"food","lat":24.13845,"lng":120.6725,"p":2,"k":"A small Japanese-era neighbourhood market known for dumplings, taro balls and rice-noodle soup.","tip":"Morning only, and quieter than Second Market.","h":"07:00-13:00","x":[1],"t":45},{"id":"tc_fuding","n":"Fu Ding Wang Pork Knuckle","z":"富鼎旺豬腳","c":"food","lat":24.14526,"lng":120.67653,"p":2,"k":"Glossy braised pork knuckle over rice, a Taichung classic with a steady queue.","h":"11:00-20:00","t":40},{"id":"tc_meatball","n":"Taichung Meatball","z":"台中肉員","c":"food","lat":24.13442,"lng":120.68257,"p":2,"k":"Since 1933: fried translucent meat dumplings in sweet-savory sauce, with a bowl of soup.","h":"11:00-20:00","t":30},{"id":"tc_qinyuan","n":"Qin Yuan Chun","z":"沁園春","c":"food","lat":24.13946,"lng":120.68272,"p":2,"k":"Old-school Shanghainese dining room from 1949: soup dumplings, braised dishes and sesame pastries.","h":"11:00-14:00,17:00-21:00","x":[1],"t":75},{"id":"tc_damian","n":"Yingcai Da Mian Geng","z":"英才大麵羹","c":"food","lat":24.1545,"lng":120.6645,"p":2,"k":"Taichung's own breakfast: thick alkaline noodles in a chive-and-shallot broth, for a few coins.","tip":"A local taste rather than a crowd-pleaser; add the chilli sauce. Pin is approximate; use the Google Maps button to find the door.","h":"06:30-17:30","t":25},{"id":"tc_karuizawa","n":"Karuizawa Hot Pot (Gongyi)","z":"輕井澤鍋物 公益店","c":"food","lat":24.15106,"lng":120.65409,"p":2,"k":"A handsome Japanese-garden hot pot hall with low prices and long opening hours.","tip":"Has a vegetable hot pot. Take a number and expect a wait at dinner.","h":"11:00-02:00","t":75},{"id":"tc_dingwang","n":"Ding Wang Spicy Hot Pot","z":"鼎王麻辣鍋 公益店","c":"food","lat":24.15119,"lng":120.65122,"p":2,"k":"The Taichung-born spicy hot pot house, known for duck-blood tofu and bowing staff.","tip":"Book ahead for dinner.","h":"11:30-02:00","t":90},{"id":"tc_hongrui","n":"Hung Rui Chen Sandwiches","z":"洪瑞珍餅店","c":"sweet","lat":24.1395,"lng":120.6815,"p":2,"k":"Soft, slightly sweet ham-and-egg sandwiches sold by the box from a 1947 bakery.","tip":"Pin is approximate; use the Google Maps button to find the door.","h":"09:00-21:00","t":15},{"id":"tc_taiyang","n":"Tai Yang Tang Sun Cakes","z":"太陽堂老店","c":"sweet","lat":24.13902,"lng":120.68093,"p":1,"k":"Flaky maltose-filled sun cakes, Taichung's standard gift box, from the street where they began.","tip":"Best eaten with tea the same day.","h":"08:00-21:00","t":15},{"id":"tc_chunshui","n":"Chun Shui Tang (Siwei original)","z":"春水堂 四維創始店","c":"sweet","lat":24.13762,"lng":120.6756,"p":3,"k":"The tea house that claims to have invented bubble milk tea, still on its first site.","tip":"Order the small pearl milk tea; the noodles and tofu snacks make it a light meal. Close to Fifth Market.","h":"08:00-22:00","t":50},{"id":"tc_fengren","n":"Fengren Ice","z":"豐仁冰","c":"sweet","lat":24.14897,"lng":120.68654,"p":2,"k":"Plum slush with kidney beans and a scoop of ice cream, a Yizhong Street original.","h":"09:30-21:00","t":20},{"id":"tc_talato","n":"I'm Talato","z":"我是塔拉朵","c":"sweet","lat":24.14948,"lng":120.66546,"p":1,"k":"Gelato shop with a pink ice-cream-themed photo room and pool of plastic sprinkles.","tip":"On Yingcai Road, north of your hotel.","h":"12:00-20:00","t":30},{"id":"tc_meijun","n":"Meijun Soy Milk Ice","z":"美軍豆乳冰","c":"sweet","lat":24.14445,"lng":120.66121,"p":1,"k":"Shaved ice built on soy milk with handmade toppings, in a tiny tiled shop.","h":"12:00-21:00","x":[2],"t":25},{"id":"tc_fengjia","n":"Fengjia Night Market","z":"逢甲夜市","c":"night","lat":24.17735,"lng":120.6466,"p":3,"k":"The biggest night market in Taiwan and the place new street snacks are launched.","tip":"Taxi from the West District is about 20 minutes. Busiest 19:00 to 22:00.","h":"16:00-01:00","t":120},{"id":"tc_yizhong","n":"Yizhong Street","z":"一中街","c":"night","lat":24.14979,"lng":120.68525,"p":2,"k":"A dense student quarter of cheap snacks, fried chicken, boba and fashion stalls.","tip":"Starts earlier than a night market; good from mid-afternoon.","h":"12:00-23:00","t":75},{"id":"tc_zhonghua","n":"Zhonghua Road Night Market","z":"中華路夜市","c":"night","lat":24.1418,"lng":120.678,"p":2,"k":"The old downtown food street: seafood, goose, noodles and ice, with almost no tourists.","tip":"Closest night market to your hotel, about 25 minutes on foot.","h":"17:00-01:00","t":75},{"id":"tc_zhongxiao","n":"Zhongxiao Road Night Market","z":"忠孝路夜市","c":"night","lat":24.13021,"lng":120.68337,"p":1,"k":"A local supper street by the university, strong on grilled and stir-fried food.","h":"17:00-01:00","t":60},{"id":"tc_animation","n":"Painted Animation Lane","z":"動漫彩繪巷","c":"sight","lat":24.142,"lng":120.6705,"p":1,"k":"A short alley covered floor to roof in anime and game murals.","tip":"Ten minutes is enough; it is on the way from the hotel to the old centre. Pin is approximate; use the Google Maps button to find the door.","h":"24h","t":15},{"id":"tc_literature","n":"Taichung Literature Museum","z":"臺中文學館","c":"museum","lat":24.13958,"lng":120.67294,"p":2,"k":"Japanese-era police dormitories turned into a small literature museum, beside a vast old banyan.","tip":"Free. Near Fifth Market, so go together in the morning.","h":"10:00-17:00","x":[1],"t":45},{"id":"tc_sixarts","n":"Natural Way Six Arts Cultural Center","z":"道禾六藝文化館","c":"sight","lat":24.13445,"lng":120.67395,"p":2,"k":"A 1937 wooden martial-arts hall with archery, tea and calligraphy rooms around a lawn.","tip":"Free to walk the grounds.","h":"09:00-17:00","x":[1],"t":40},{"id":"tc_statehall","n":"Taichung Prefectural Hall","z":"臺中州廳","c":"sight","lat":24.13856,"lng":120.67843,"p":1,"k":"The white French-roofed 1913 government hall, the centrepiece of the Japanese-era quarter.","tip":"Under long restoration; view from outside.","h":"24h","t":15},{"id":"tc_heritage","n":"Cultural Heritage Park","z":"文化部文化資產園區","c":"sight","lat":24.13251,"lng":120.68136,"p":1,"k":"A former sake brewery with warehouses, tanks and small exhibitions on heritage crafts.","h":"09:00-17:00","x":[1],"t":50},{"id":"tc_confucius","n":"Taichung Confucius Temple","z":"臺中孔廟","c":"temple","lat":24.15378,"lng":120.6893,"p":2,"k":"A large Song-style temple complex of yellow roofs and still courtyards, rarely busy.","h":"09:00-17:00","x":[1],"t":35},{"id":"tc_paochueh","n":"Paochueh Temple","z":"寶覺禪寺","c":"temple","lat":24.15949,"lng":120.6879,"p":2,"k":"Home of a 30-metre golden laughing Buddha, with an old hall preserved inside a new shell.","h":"08:00-17:00","t":35},{"id":"tc_lecheng","n":"Lecheng Temple","z":"樂成宮","c":"temple","lat":24.14078,"lng":120.69819,"p":1,"k":"An ornate 18th-century Mazu temple where people come to pray to the matchmaker god.","h":"06:00-22:00","t":30},{"id":"tc_wanhe","n":"Wanhe Temple and Nantun Old Street","z":"萬和宮","c":"temple","lat":24.13794,"lng":120.63903,"p":2,"k":"Taichung's oldest temple, from 1726, at the head of a short street of century-old shops.","tip":"Try the peanut candy and old-style pastries on the street.","h":"06:00-22:00","t":50,"m":"Nantun"},{"id":"tc_mojo","n":"The Factory Mojocoffee","z":"The Factory Mojocoffee","c":"cafe","lat":24.155,"lng":120.65707,"p":3,"k":"The roaster that put Taichung on the specialty map, in a bright two-storey workshop café.","tip":"Pour-over menu changes often; ask what is freshly roasted.","h":"09:00-18:00","t":60},{"id":"tc_stopover","n":"Coffee Stopover","z":"Coffee Stopover","c":"cafe","lat":24.14795,"lng":120.66804,"p":2,"k":"Competition-winning baristas serving careful pour-overs and signature coffee drinks.","tip":"Small and popular; weekday afternoons are easiest.","h":"12:00-19:00","t":50},{"id":"tc_orsir","n":"Orsir Coffee","z":"歐舍咖啡","c":"cafe","lat":24.14339,"lng":120.66931,"p":2,"k":"One of Taiwan's pioneer specialty roasters, with a long bar for tasting single origins.","h":"10:00-18:00","x":[0],"t":50},{"id":"tc_mezamashi","n":"Mezamashi Kohi","z":"目覺咖啡","c":"cafe","lat":24.15,"lng":120.66,"p":2,"k":"Japanese-style café in an old house, known for latte art, toast sets and garden seats.","tip":"Has several branches; this pin is the West District one. Pin is approximate; use the Google Maps button to find the door.","h":"08:00-18:00","t":60},{"id":"tc_caffaina","n":"Caffaina (Huilai)","z":"卡啡那 惠來店","c":"cafe","lat":24.15568,"lng":120.6412,"p":1,"k":"A grand glass café with a wall of cakes, a short walk from the National Taichung Theater.","h":"08:00-22:00","t":60,"m":"Taichung City Hall"},{"id":"tc_wuwei","n":"Wu Wei Tsao Tang Tea House","z":"無為草堂","c":"cafe","lat":24.15106,"lng":120.64949,"p":3,"k":"Wooden pavilions around a koi pond in the middle of the city; order a pot of oolong and stay.","tip":"Minimum order per person. Set meals include vegetarian options.","h":"10:30-21:30","t":90},{"id":"tc_beihuan","n":"Bei Huan Sui Yue Tea House","z":"悲歡歲月人文茶館","c":"cafe","lat":24.13675,"lng":120.67203,"p":2,"k":"A quiet tea house in a Japanese-era wooden home with tatami rooms and a small garden.","h":"11:00-21:00","t":75},{"id":"tc_rosehouse","n":"Rose House at the Art Museum","z":"古典玫瑰園 國美館店","c":"cafe","lat":24.141,"lng":120.664,"p":1,"k":"English-style tea room inside the fine arts museum, looking onto the sculpture lawn.","h":"09:00-17:00","x":[1],"t":45},{"id":"tc_donghai","n":"Donghai Bookstore","z":"東海書苑","c":"book","lat":24.1425,"lng":120.6615,"p":2,"k":"A long-running independent bookshop for humanities and social thought, with coffee.","tip":"Mostly Chinese-language stock; worth it for the room and the regulars. Pin is approximate; use the Google Maps button to find the door.","h":"12:00-21:00","t":40},{"id":"tc_yuli","n":"Yuli Bookstore","z":"魚麗人文主題書店","c":"book","lat":24.1395,"lng":120.6625,"p":2,"k":"Half bookshop, half home-cooking kitchen, behind the fine arts museum.","tip":"Set lunches sell out; books are browsable any time. Pin is approximate; use the Google Maps button to find the door.","h":"11:00-20:00","x":[0,1],"t":50},{"id":"tc_freshbooks","n":"Fresh Books","z":"新手書店","c":"book","lat":24.15,"lng":120.6585,"p":2,"k":"A small, carefully chosen independent bookshop with a reading table and frequent talks.","tip":"Pin is approximate; use the Google Maps button to find the door.","h":"12:00-21:00","t":35},{"id":"tc_artqpie","n":"Artqpie Library","z":"本冊圖書館","c":"book","lat":24.14504,"lng":120.6601,"p":2,"k":"A design studio's reading room of art, photo and zine titles in a Shen Ji back lane.","tip":"Opening days vary; check before making a special trip.","h":"13:00-19:00","x":[1,2],"t":35},{"id":"tc_wuhou","n":"Afternoon Bookhouse","z":"午後書房","c" const zlabs=[...svg.querySelectorAll('.zlab')].map(el=>({el,z:zById[el.dataset.zone],o:scaled.find(o=>o.el===el),w:+el.dataset.w})).sort((a,b)=>a.z.d-b.z.d);
const pinEls=Object.fromEntries([...svg.querySelectorAll('.pin')].map(el=>[el.dataset.id,el]));
const zoneEls=Object.fromEntries([...svg.querySelectorAll('.zone')].map(el=>[el.dataset.zone,el]));
const rl=[...svg.querySelectorAll('.rl')],rg=[...svg.querySelectorAll('.rg')],dl=[...svg.querySelectorAll('.dl')],stn=[...svg.querySelectorAll('.stn')];

// ---- view
let cw=1,ch=1,cx=H[0],cy=H[1],k=0.5,raf=0;
const state={group:null,day:null,sel:null};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const kmin=()=>Math.max(cw/G.w,ch/G.h),KMAX=3.2;
function clampView(){k=Math.min(KMAX,Math.max(kmin(),k));const w=cw/k,hh=ch/k;cx=Math.min(G.w-w/2,Math.max(w/2,cx));cy=Math.min(G.h-hh/2,Math.max(hh/2,cy))}
let lastK=0;
function apply(){clampView();const w=cw/k,hh=ch/k;svg.setAttribute('viewBox',`${(cx-w/2).toFixed(1)} ${(cy-hh/2).toFixed(1)} ${w.toFixed(1)} ${hh.toFixed(1)}`);if(k!==lastK){lastK=k;rescale()}}
function rescale(){const s=(1/k).toFixed(4);for(const o of scaled)o.el.setAttribute('transform',`translate(${o.x} ${o.y})${o.r?` rotate(${o.r})`:''} scale(${s})`);
  const st=svg.style,c=(a,v,b)=>Math.min(b,Math.max(a,v))+'px';
  st.setProperty('--wp',c(1.1,k*5.5,9));st.setProperty('--ws',c(.6,k*3.2,6));st.setProperty('--wf',c(1.6,k*6,10));st.setProperty('--wt',c(3,k*8,13));st.setProperty('--ww',c(1,k*4,8));st.setProperty('--wg',c(3,k*14,26));
  for(const e of rl)e.toggleAttribute('hidden',k<0.4);for(const e of rg)e.toggleAttribute('hidden',k<0.3);for(const e of stn)e.toggleAttribute('hidden',k<0.16);
  declutter();
  // scale bar
  const target=90/k*5,nice=[100,200,500,1000,2000,5000].reduce((a,b)=>Math.abs(b-target)<Math.abs(a-target)?b:a);const sb=document.getElementById('scale');sb.firstElementChild.style.width=(nice/5*k)+'px';sb.lastElementChild.textContent=nice>=1000?nice/1000+' km':nice+' m'}
function pinVisible(p){return !state.group||p.g===state.group}
function pinDim(p){return state.day&&!DAYS[state.day].steps.some(s=>s.z===p.zone)}
function declutter(){const boxes=[[H[0]*k-52,H[1]*k-9,60,18]],hit=b=>boxes.some(o=>b[0]<o[0]+o[2]&&b[0]+b[2]>o[0]&&b[1]<o[1]+o[3]&&b[1]+b[3]>o[1]);
  // zone pills: nearest zone first; sit above the wash, or below it, or to a side if that spot is taken
  for(const L of zlabs){const z=L.z,sx=z.mx*k,up=(z.top-48)*k-15,dn=(z.bot+48)*k+15,mid=(z.top+z.bot)/2*k,half=((z.bot-z.top)/2+48)*k;
    const tries=[[sx,up],[sx,dn],[sx+L.w/2+half*.6,mid],[sx-L.w/2-half*.6,mid],[sx,up-24],[sx,dn+24]];let pick=tries[0];
    for(const t of tries){if(!hit([t[0]-L.w/2-2,t[1]-12,L.w+4,24])){pick=t;break}}
    boxes.push([pick[0]-L.w/2-2,pick[1]-12,L.w+4,24]);L.o.x=pick[0]/k;L.o.y=pick[1]/k;L.el.setAttribute('transform',`translate(${L.o.x} ${L.o.y}) scale(${1/k})`)}
  for(const L of labels){let show=k>=L.mink;const p=L.id&&byId[L.id];const sel=p&&state.sel&&state.sel.id===L.id;
    if(p&&(!pinVisible(p)||(pinDim(p)&&!sel)))show=false;if(sel)show=true;
    if(show){const b=[L.x*k+4,L.y*k-8,L.w,16];if(!sel)for(const o of boxes){if(b[0]<o[0]+o[2]&&b[0]+b[2]>o[0]&&b[1]<o[1]+o[3]&&b[1]+b[3]>o[1]){show=false;break}}if(show)boxes.push(b)}
    L.el.toggleAttribute('hidden',!show)}}
let touched=false;function resize(){cw=wrap.clientWidth||1;ch=wrap.clientHeight||1;lastK=0;if(touched)apply();else fit(HOMEBOX,false)}
function fit(box,animate){const a=proj(box[2],box[1]),b=proj(box[0],box[3]);const top=48,nk=Math.min(KMAX,Math.max(kmin(),Math.min(cw/(b[0]-a[0]),(ch-top)/(b[1]-a[1]))*0.92));fly((a[0]+b[0])/2,(a[1]+b[1])/2-top/2/nk,nk,animate)}
function fly(nx,ny,nk,animate){if(animate)touched=true;cancelAnimationFrame(raf);if(!animate||reduce){cx=nx;cy=ny;k=nk;apply();return}
  nk=Math.min(KMAX,Math.max(kmin(),nk));const sx=cx,sy=cy,sk=k,t0=performance.now();
  const step=t=>{let u=Math.min(1,(t-t0)/420);u=u<.5?2*u*u:1-(-2*u+2)**2/2;k=sk*Math.pow(nk/sk,u);cx=sx+(nx-sx)*u;cy=sy+(ny-sy)*u;apply();if(u<1)raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)}
const HOMEBOX=[24.1290,120.6330,24.1810,120.6930];
function zoomAt(px,py,f){const ux=cx+(px-cw/2)/k,uy=cy+(py-ch/2)/k;k=Math.min(KMAX,Math.max(kmin(),k*f));cx=ux-(px-cw/2)/k;cy=uy-(py-ch/2)/k;apply()}

// ---- pointer handling
const pts=new Map();let moved=0,pinchD=0;
svg.addEventListener('pointerdown',e=>{touched=true;cancelAnimationFrame(raf);svg.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===1)moved=0;if(pts.size===2){const[a,b]=[...pts.values()];pinchD=Math.hypot(a[0]-b[0],a[1]-b[1])}});
svg.addEventListener('pointermove',e=>{const q=pts.get(e.pointerId);if(!q)return;const dx=e.clientX-q[0],dy=e.clientY-q[1];
  if(pts.size===1){moved+=Math.abs(dx)+Math.abs(dy);if(moved>6){svg.classList.add('drag');cx-=dx/k;cy-=dy/k;apply()}pts.set(e.pointerId,[e.clientX,e.clientY])}
  else if(pts.size===2){pts.set(e.pointerId,[e.clientX,e.clientY]);const[a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),r=wrap.getBoundingClientRect();moved=99;cx-=dx/2/k;cy-=dy/2/k;if(pinchD>0)zoomAt((a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top,d/pinchD);pinchD=d}});
function up(e){if(!pts.has(e.pointerId))return;const was=pts.size;pts.delete(e.pointerId);svg.classList.remove('drag');
  if(was===1&&moved<=6&&e.type==='pointerup'){try{svg.releasePointerCapture(e.pointerId)}catch(_){}
    const el=document.elementFromPoint(e.clientX,e.clientY),t=el&&el.closest&&el.closest('[data-id],[data-zone]');
    if(t&&svg.contains(t)){if(t.dataset.id)select({type:'place',id:t.dataset.id});else select({type:'zone',id:t.dataset.zone})}}}
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{touched=true;e.preventDefault();const r=wrap.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0018)))},{passive:false});
document.getElementById('zin').onclick=()=>fly(cx,cy,k*1.6,true);
document.getElementById('zout').onclick=()=>fly(cx,cy,k/1.6,true);
document.getElementById('zhome').onclick=()=>fit(HOMEBOX,true);

// ---- chips
const chips=document.getElementById('chips');
chips.innerHTML=`<button class="chip" data-g="" aria-pressed="true">All places</button>`+Object.entries(GROUPS).map(([g,v])=>`<button class="chip" data-g="${g}" aria-pressed="false"><i style="background:var(--c-${g})"></i>${v.label}</button>`).join('');
chips.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;state.group=b.dataset.g||null;chips.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String((c.dataset.g||null)===state.group)));paint();render()};

// ---- state to map
function paint(){
  for(const p of PL){const el=pinEls[p.id];if(!el)continue;el.toggleAttribute('hidden',!pinVisible(p));el.classList.toggle('dim',!!pinDim(p));el.classList.toggle('sel',!!(state.sel&&state.sel.id===p.id))}
  const day=state.day&&DAYS[state.day];
  for(const z of ZONES){const el=zoneEls[z.id],inDay=day&&day.steps.some(s=>s.z===z.id),sel=state.sel&&state.sel.type==='zone'&&state.sel.id===z.id;el.classList.toggle('on',!!(inDay||sel));el.classList.toggle('dim',!!(day&&!inDay&&!sel))}
  const route=document.getElementById('route');
  if(day){const seq=[H].concat(day.steps.map(s=>[zById[s.z].x0,zById[s.z].y0]));route.setAttribute('d','M'+seq.map(p=>p.map(Math.round).join(' ')).join('L'))}else route.setAttribute('d','');
  declutter()}
function select(sel,noFly){state.sel=sel;paint();render();panel.scrollTop=0;
  if(sel&&!noFly){if(sel.type==='zone'){const z=zById[sel.id],m=(z.r+350)/5;fly(z.x0,z.y0,Math.min(cw,ch)/(2*m),true)}else{const p=byId[sel.id];if(p.on)fly(p.x0,p.y0,Math.max(k,1.1),true)}}}
function setDay(d){state.day=d;state.sel=null;paint();render();
  if(d){const zs=DAYS[d].steps.map(s=>zById[s.z]);const la=zs.map(z=>z.lat).concat(HOTEL.lat),lo=zs.map(z=>z.lng).concat(HOTEL.lng);fit([Math.min(...la)-.008,Math.min(...lo)-.008,Math.max(...la)+.008,Math.max(...lo)+.008],true)}else fit(HOMEBOX,true)}

// ---- panel
const SW={tb:'<path d="M1 7h20" stroke="var(--spine)" stroke-width="5" stroke-linecap="round"/>',gw:'<path d="M1 7h20" stroke="var(--green)" stroke-width="6" stroke-linecap="round" opacity=".75"/>',tra:'<path d="M1 7h20" stroke="var(--ink)" stroke-width="4"/><path d="M1 7h20" stroke="var(--paper)" stroke-width="1.6" stroke-dasharray="4 4"/>',mrt:'<path d="M1 7h20" stroke="var(--mrt)" stroke-width="4" stroke-linecap="round"/>',hsr:'<path d="M1 7h20" stroke="var(--hsr)" stroke-width="4" stroke-dasharray="6 3"/>'};
const sw=k=>`<svg viewBox="0 0 22 14" aria-hidden="true">${SW[k]}</svg>`;
function placeRow(p){return `<button class="row" data-place="${p.id}"><b><span class="dot" style="background:var(--c-${p.g})"></span>${esc(p.n)}</b><span class="m">${travel(p.d)}</span><span class="d">${esc(p.k)}</span></button>`}
function closedLine(p,wd){return (p.x||[]).includes(wd)}
function render(){const s=state.sel;let o='';
  if(s&&s.type==='place'){const p=byId[s.id],z=p.zone&&zById[p.zone];const dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    o+=`<button class="back" data-back="${z?z.id:''}">← ${z?esc(z.n):'Overview'}</button><h2>${esc(p.n)}</h2>${p.z!==p.n?`<div class="zh">${esc(p.z)}</div>`:''}<p>${esc(p.k)}</p>${p.tip?`<p class="lede">${esc(p.tip)}</p>`:''}
    <dl class="facts"><dt>Kind</dt><dd>${CATNAME[p.c]||p.c}</dd><dt>From hotel</dt><dd>${kmTxt(p.d)} ${COMPASS[Math.round(bearing(HOTEL,p)/45)%8]} · ${travel(p.d)}</dd><dt>Hours</dt><dd>${p.h==='24h'?'Open all day':esc((p.h||'Check locally').replace(/-/g,'–').replace(/,/g,', '))}${(p.x||[]).length?' · closed '+p.x.map(d=>dn[d]).join(', '):''}</dd><dt>Allow</dt><dd>${p.t>=90?(p.t/60).toFixed(1).replace('.0','')+' h':p.t+' min'}</dd>${p.m?`<dt>MRT</dt><dd>${esc(p.m)}</dd>`:''}</dl>
    <div class="btns"><a class="btn pri" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.z+' 台中')}">Open in Google Maps</a><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}">Directions</a></div>
    <p class="fine">Hours come from your trip places list and are not live. Check before you go.</p>`}
  else if(s&&s.type==='zone'){const z=zById[s.id],list=z.places.filter(pinVisible);
    o+=`<button class="back" data-back="">← Overview</button><h2>${esc(z.n)}</h2><div class="zh">${z.z}</div><p>${esc(z.feel)}</p>
    <dl class="facts"><dt>From hotel</dt><dd>${z.id==='home'?'You are in it':kmTxt(z.d)+' '+COMPASS[Math.round(bearing(HOTEL,z)/45)%8]+' · '+travel(z.d)}</dd><dt>Best</dt><dd>${esc(z.best)}</dd></dl>
    <h3>${list.length} ${state.group?GROUPS[state.group].label.toLowerCase():'places'} here</h3><div class="rows">${list.map(placeRow).join('')||'<p class="lede">Nothing of this kind in this zone. Switch the filter back to All places.</p>'}</div>`}
  else{
    o+=`<h1>Taichung, laid out</h1><p class="lede">15–18 Nov · based at The Place Taichung, West District. Yellow washes are walkable zones; tap one, or any dot.</p>
    <div class="seg" role="group" aria-label="Show a day">${[['','Whole city'],['mon','Mon 16'],['tue','Tue 17']].map(([d,l])=>`<button data-day="${d}" aria-pressed="${(state.day||'')===d}">${l}</button>`).join('')}</div>`;
    if(state.day){const D=DAYS[state.day];const shut=PL.filter(p=>p.p>=2&&D.steps.some(st=>st.z===p.zone)&&closedLine(p,D.wd));
      o+=`<h3>${D.label} · ${esc(D.title)}</h3><p style="margin:0 0 6px">${esc(D.lede)}</p><div>${D.steps.map((st,i)=>{const z=zById[st.z];return `<button class="step" data-zone="${z.id}"><i>${i+1}</i><span><small>${esc(st.when)} · ${z.id==='home'?'at your door':travel(z.d)+' from hotel'}</small><b>${esc(z.n)}</b><br>${esc(st.txt)}</span></button>`}).join('')}</div>`;
      if(shut.length)o+=`<div class="warn"><b>Closed ${D.wdName}:</b> ${shut.map(p=>esc(p.n)).join(', ')}.</div>`}
    else{
      o+=`<h3>How the city fits together</h3><div>${NOTES.map(n=>`<button class="note" data-note="${n.k}">${sw(n.sw)}<span><b>${esc(n.t)}.</b> ${esc(n.d)}</span></button>`).join('')}<div class="note">${sw('hsr')}<span><b>High-speed rail is out in Wuri.</b> The HSR station is ${kmTxt(dist(HOTEL,{lat:24.1121,lng:120.6159}))} southwest of the hotel, about 20–25 minutes by taxi. That is your ride out on Wed 18.</span></div></div>`}
    o+=`<h3>Zones, nearest first</h3><div class="rows">${ZONES.slice().sort((a,b)=>a.d-b.d).map(z=>{const n=z.places.filter(pinVisible).length;return `<button class="row" data-zone="${z.id}"><b>${esc(z.n)}</b><span class="m">${z.id==='home'?'here':travel(z.d)}</span><span class="d">${z.z} · ${n} ${n===1?'place':'places'}</span></button>`}).join('')}</div>`;
    const loose=PL.filter(p=>p.on&&!p.zone&&pinVisible(p)).sort((a,b)=>a.d-b.d);
    if(loose.length)o+=`<h3>On the map, outside the zones</h3><div class="rows">${loose.map(placeRow).join('')}</div>`;
    const far=PL.filter(p=>!p.on&&pinVisible(p)).sort((a,b)=>a.d-b.d);
    if(far.length)o+=`<h3>Beyond the map</h3><div class="rows">${far.map(p=>{const b=bearing(HOTEL,p);return `<button class="row" data-place="${p.id}"><b><svg class="arrow" viewBox="0 0 14 14" style="transform:rotate(${Math.round(b)}deg)" aria-hidden="true"><path d="M7 1 12 12 7 9.5 2 12z" fill="currentColor"/></svg>${esc(p.n)}</b><span class="m">${Math.round(p.d/1000)} km ${COMPASS[Math.round(b/45)%8]}</span><span class="d">${esc(p.k)}</span></button>`}).join('')}</div>`;
    o+=`<p class="fine">Walking times assume 80 m a minute on streets about 1.3× the straight line. Taxi times are rough. Places and hours come from your trip places list.</p>`}
  panel.innerHTML=o}
panel.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if('day' in d)setDay(d.day||null);
  else if(d.zone)select({type:'zone',id:d.zone});
  else if(d.place)select({type:'place',id:d.place});
  else if('back' in d){if(d.back)select({type:'zone',id:d.back},true);else select(null)}
  else if(d.note){const n=NOTES.find(n=>n.k===d.note);fit(n.box,true)}});

new ResizeObserver(resize).observe(wrap);
cw=wrap.clientWidth||1;ch=wrap.clientHeight||1;fit(HOMEBOX,false);paint();render();
</script>
</body></html>
