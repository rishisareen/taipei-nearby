<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16303a"><style>:root{padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style></head><body><title>Tainan Layout Map</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a survey-style map fills the screen; a side sheet (bottom sheet on phones) explains whatever is selected. Zones are highlighter washes, pins are coloured by kind. */
:root{
  --land:#eceee6; --land2:#e3e7dc; --paper:#f8f9f4; --ink:#16303a; --sub:#55686e; --line:#cdd4cb;
  --road:#ffffff; --fwy:#b9b3c9; --spine:#ee7b4d; --water:#4f9bc7; --water-ink:#256a93; --park:#c9ddb6; --green:#5fa862;
  --mrt:#1f9d57; --hsr:#b0621a; --zone:#f5c400; --zone-o:.30; --zone-on:.62;
  --c-sights:#6741d9; --c-eat:#d9480f; --c-cafe:#7f5539; --c-books:#1864ab; --c-night:#a61e4d; --c-out:#2b8a3e;
  --display:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --land:#1b2327; --land2:#20292d; --paper:#141b1e; --ink:#e7eeed; --sub:#9db0b3; --line:#34424a;
  --road:#33414a; --fwy:#5b5670; --spine:#e8794e; --water:#2f7fae; --water-ink:#7cc0e6; --park:#263a28; --green:#4f9a55;
  --mrt:#3ecb7c; --hsr:#e09a4f; --zone:#f5c400; --zone-o:.17; --zone-on:.40;
  --c-sights:#b197fc; --c-eat:#ffa94d; --c-cafe:#d9ad84; --c-books:#74c0fc; --c-night:#f783ac; --c-out:#8ce99a;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --land:#1b2327; --land2:#20292d; --paper:#141b1e; --ink:#e7eeed; --sub:#9db0b3; --line:#34424a;
  --road:#33414a; --fwy:#5b5670; --spine:#e8794e; --water:#2f7fae; --water-ink:#7cc0e6; --park:#263a28; --green:#4f9a55;
  --mrt:#3ecb7c; --hsr:#e09a4f; --zone:#f5c400; --zone-o:.17; --zone-on:.40;
  --c-sights:#b197fc; --c-eat:#ffa94d; --c-cafe:#d9ad84; --c-books:#74c0fc; --c-night:#f783ac; --c-out:#8ce99a;
  color-scheme:dark }
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;display:flex;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.mapwrap{position:relative;flex:1 1 auto;min-width:0;min-height:0;background:var(--land);overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.drag{cursor:grabbing}
.panel{flex:0 0 400px;max-width:44%;overflow-y:auto;border-left:1px solid var(--line);padding-block:20px 28px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));min-width:0}
@media (max-width:760px){
  body{flex-direction:column}
  .mapwrap{flex:1 1 52%}
  .panel{flex:0 0 48%;max-width:none;border-left:0;border-top:1px solid var(--line);padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
/* map layers */
.ns{vector-effect:non-scaling-stroke;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dist{fill:var(--land);stroke:var(--sub);stroke-width:1px;stroke-dasharray:1 4;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.dist.alt{fill:var(--land2)}
#parks{fill:var(--park)} #water{stroke:var(--water);stroke-width:var(--ww)} #warea{fill:var(--water)}
.wlab{font-size:10.5px;font-style:italic;font-weight:500;fill:var(--water-ink);text-anchor:middle;letter-spacing:.04em}
#rf{stroke:var(--fwy);stroke-width:var(--wf)} #rs{stroke:var(--road);stroke-width:var(--ws)} #rp{stroke:var(--road);stroke-width:var(--wp)}
#tb{stroke:var(--spine);stroke-width:var(--wt)}
#gway{stroke:var(--green);stroke-width:var(--wg);opacity:.75}
#tra1{stroke:var(--ink);stroke-width:3px} #tra2{stroke:var(--land);stroke-width:1.4px;stroke-dasharray:6 6;stroke-linecap:butt}
#hsr{stroke:var(--hsr);stroke-width:3px;stroke-dasharray:9 4;stroke-linecap:butt} #mrt{stroke:var(--mrt);stroke-width:3.2px}
.zone path{fill:var(--zone);stroke:var(--zone);stroke-linejoin:round;stroke-linecap:round}
.zone{opacity:var(--zone-o);transition:opacity .2s}
.zone.on{opacity:var(--zone-on)} .zone.dim{opacity:.07}
.ring{fill:none;stroke:var(--ink);stroke-width:1px;stroke-dasharray:3 4;vector-effect:non-scaling-stroke;opacity:.55}
#route{fill:none;stroke:var(--ink);stroke-width:2px;stroke-dasharray:2 5;vector-effect:non-scaling-stroke;stroke-linecap:round}
text{font-family:var(--body);fill:var(--ink)}
.halo{paint-order:stroke;stroke:var(--land);stroke-width:3.5px;stroke-linejoin:round}
.dlab{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.2em;fill:var(--sub);opacity:.75;text-anchor:middle}
.dlab tspan{font-family:var(--body);font-weight:400;font-size:10px;letter-spacing:.05em}
.rlab{font-size:10px;fill:var(--sub);text-anchor:middle}
.slab{font-size:10.5px;font-weight:500}
.ringlab{font-family:var(--mono);font-size:10px;text-anchor:middle;fill:var(--sub)}
.plab{font-size:11.5px;font-weight:500}
.pin circle.dot{stroke:var(--land);stroke-width:1.5px}
.pin.dim{opacity:.22}
.halo2{fill:none;stroke:none}
[hidden]{display:none!important}
#sea{fill:var(--water);fill-rule:evenodd}
.sealab{font-size:11px;font-style:italic;font-weight:500;fill:var(--water-ink);text-anchor:middle;letter-spacing:.12em}
.pin.sel circle.halo2{fill:none;stroke:var(--ink);stroke-width:2px}
.g-sights .dot{fill:var(--c-sights)} .g-eat .dot{fill:var(--c-eat)} .g-cafe .dot{fill:var(--c-cafe)} .g-books .dot{fill:var(--c-books)} .g-night .dot{fill:var(--c-night)} .g-out .dot{fill:var(--c-out)}
.zlab rect{fill:var(--ink)} .zlab text{fill:var(--paper);font-family:var(--display);font-weight:600;font-size:12px;text-anchor:middle}
.zlab,.pin{cursor:pointer}
.hotel rect{fill:var(--ink);stroke:var(--land);stroke-width:2px} .hotel text{font-weight:600;font-size:12px}
.st-m{fill:var(--land);stroke:var(--mrt);stroke-width:2px} .st-t{fill:var(--land);stroke:var(--ink);stroke-width:2px} .st-h{fill:var(--hsr);stroke:var(--land);stroke-width:2px}
/* floating controls */
.chips{position:absolute;top:0;left:0;right:0;display:flex;gap:6px;overflow-x:auto;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chip i{width:9px;height:9px;border-radius:50%;flex:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.zoom button{width:38px;height:38px;text-align:center;font-size:19px;line-height:1}
.zoom button+button{border-top:1px solid var(--line)}
.zoom svg{width:17px;height:17px;vertical-align:-3px}
.scale{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;font-family:var(--mono);font-size:10.5px;color:var(--sub);pointer-events:none}
.scale b{display:block;height:5px;border:1.5px solid var(--sub);border-top:0;margin-bottom:2px}
.credit{position:absolute;left:50%;transform:translateX(-50%);bottom:3px;font-size:9.5px;color:var(--sub);opacity:.8;pointer-events:none;white-space:nowrap}
/* panel */
h1{font-family:var(--display);font-size:26px;line-height:1.1;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--display);font-size:22px;line-height:1.15;font-weight:700;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);margin:22px 0 8px}
.lede{color:var(--sub);margin:6px 0 0}
.zh{color:var(--sub);font-size:14px;margin-top:2px}
.seg{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.seg button{padding:7px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);width:100%;align-items:baseline}
.row:last-child{border-bottom:1px solid var(--line)}
.row b{font-weight:600} .row .m{font-family:var(--mono);font-size:12px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.row span.d{grid-column:1/-1;color:var(--sub);font-size:13.5px}
.row:hover b{text-decoration:underline}
.row .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.note{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:9px 0;width:100%;align-items:start}
.note svg{width:22px;height:14px;margin-top:4px}
.note b{font-weight:600}
.note:hover b{text-decoration:underline}
.back{font-size:13.5px;color:var(--sub);margin-bottom:12px;font-weight:500}
.back:hover{color:var(--ink)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0 0;font-size:14px}
.facts dt{color:var(--sub)} .facts dd{margin:0}
.warn{margin-top:12px;padding:10px 12px;border:1px dashed var(--ink);border-radius:8px;font-size:13.5px}
.step{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);width:100%}
.step i{font-style:normal;font-family:var(--mono);font-size:12px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.step small{display:block;color:var(--sub);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.step:hover b{text-decoration:underline}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{padding:9px 14px;border-radius:8px;border:1px solid var(--ink);font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--paper)}
.arrow{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:6px}
.fine{font-size:12px;color:var(--sub);margin-top:18px}
@media (prefers-reduced-motion:reduce){.zone{transition:none}}
</style>

const PL=[{"id":"tn_chihkan","n":"Chihkan Tower","z":"赤崁樓","c":"sight","lat":22.99727,"lng":120.2027,"p":3,"k":"The 1653 Dutch fort rebuilt as Chinese pavilions, set in a pond garden; lit up at night.","tip":"Open late, so come after dinner when the tour groups have gone.","h":"08:30-21:30","t":45},{"id":"tn_shennong","n":"Shennong Street","z":"神農街","c":"sight","lat":22.9978,"lng":120.19601,"p":3,"k":"A lantern-lit lane of two-storey Qing shophouses, now small bars, craft shops and cafés.","tip":"Best from dusk. About 15 minutes' walk west of your hotel.","h":"24h","t":45},{"id":"tn_anpingfort","n":"Anping Fort","z":"安平古堡","c":"sight","lat":23.00161,"lng":120.16057,"p":3,"k":"Fort Zeelandia, the Dutch East India Company's 1624 base, with brick walls and a lookout tower.","tip":"Taxi from the centre is about 15 minutes. Pair with the Tree House and Old Street.","h":"08:30-17:30","t":50},{"id":"tn_treehouse","n":"Anping Tree House","z":"安平樹屋","c":"sight","lat":23.00403,"lng":120.15974,"p":3,"k":"A salt warehouse swallowed by banyan roots, with walkways through the canopy.","tip":"Ticket includes the Tait & Co. merchant house next door.","h":"08:30-17:30","t":45},{"id":"tn_anpingst","n":"Anping Old Street","z":"安平老街","c":"shop","lat":23.00067,"lng":120.1624,"p":2,"k":"Taiwan's oldest street: shrimp crackers, candied fruit and oyster omelettes in narrow lanes.","tip":"Crowded at weekends; the side alleys are calmer.","h":"10:00-19:00","t":60},{"id":"tn_hayashi","n":"Hayashi Department Store","z":"林百貨","c":"shop","lat":22.99206,"lng":120.20224,"p":3,"k":"A 1932 Art Deco store restored with its original lift, selling Tainan design goods; rooftop shrine.","tip":"Go at dusk for the lit façade, then up to the roof.","h":"11:00-21:00","t":45},{"id":"tn_blueprint","n":"Blueprint Culture & Creative Park","z":"藍晒圖文創園區","c":"shop","lat":22.98677,"lng":120.19682,"p":2,"k":"Old judicial dormitories turned into indie shops around a glowing blue 3D blueprint mural.","tip":"Most shops     if(t&&svg.contains(t)){if(t.dataset.id)select({type:'place',id:t.dataset.id});else select({type:'zone',id:t.dataset.zone})}}}
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{touched=true;e.preventDefault();const r=wrap.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0018)))},{passive:false});
document.getElementById('zin').onclick=()=>fly(cx,cy,k*1.6,true);
document.getElementById('zout').onclick=()=>fly(cx,cy,k/1.6,true);
document.getElementById('zhome').onclick=()=>fit(HOMEBOX,true);

// ---- chips
const chips=document.getElementById('chips');
chips.innerHTML=`<button class="chip" data-g="" aria-pressed="true">All places</button>`+Object.entries(GROUPS).map(([g,v])=>`<button class="chip" data-g="${g}" aria-pressed="false"><i style="background:var(--c-${g})"></i>${v.label}</button>`).join('');
chips.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;state.group=b.dataset.g||null;chips.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String((c.dataset.g||null)===state.group)));paint();render()};

// ---- state to map
function paint(){
  for(const p of PL){const el=pinEls[p.id];if(!el)continue;el.toggleAttribute('hidden',!pinVisible(p));el.classList.toggle('dim',!!pinDim(p));el.classList.toggle('sel',!!(state.sel&&state.sel.id===p.id))}
  const day=state.day&&DAYS[state.day];
  for(const z of ZONES){const el=zoneEls[z.id],inDay=day&&day.steps.some(s=>s.z===z.id),sel=state.sel&&state.sel.type==='zone'&&state.sel.id===z.id;el.classList.toggle('on',!!(inDay||sel));el.classList.toggle('dim',!!(day&&!inDay&&!sel))}
  const route=document.getElementById('route');
  if(day){const seq=[H].concat(day.steps.map(s=>[zById[s.z].x0,zById[s.z].y0]));route.setAttribute('d','M'+seq.map(p=>p.map(Math.round).join(' ')).join('L'))}else route.setAttribute('d','');
  declutter()}
function select(sel,noFly){state.sel=sel;paint();render();panel.scrollTop=0;
  if(sel&&!noFly){if(sel.type==='zone'){const z=zById[sel.id],m=(z.r+220)/5;fly(z.x0,z.y0,Math.min(cw,ch)/(2*m),true)}else{const p=byId[sel.id];if(p.on)fly(p.x0,p.y0,Math.max(k,1.1),true)}}}
function setDay(d){state.day=d;state.sel=null;paint();render();
  if(d){const zs=DAYS[d].steps.map(s=>zById[s.z]);const la=zs.map(z=>z.lat).concat(HOTEL.lat),lo=zs.map(z=>z.lng).concat(HOTEL.lng);fit([Math.min(...la)-.008,Math.min(...lo)-.008,Math.max(...la)+.008,Math.max(...lo)+.008],true)}else fit(HOMEBOX,true)}

// ---- panel
const SW={tb:'<path d="M1 7h20" stroke="var(--spine)" stroke-width="5" stroke-linecap="round"/>',gw:'<path d="M1 7h20" stroke="var(--green)" stroke-width="6" stroke-linecap="round" opacity=".75"/>',tra:'<path d="M1 7h20" stroke="var(--ink)" stroke-width="4"/><path d="M1 7h20" stroke="var(--paper)" stroke-width="1.6" stroke-dasharray="4 4"/>',mrt:'<path d="M1 7h20" stroke="var(--mrt)" stroke-width="4" stroke-linecap="round"/>',hsr:'<path d="M1 7h20" stroke="var(--hsr)" stroke-width="4" stroke-dasharray="6 3"/>',riv:'<path d="M1 9c4-6 6 2 10-2s6 2 10-2" stroke="var(--water)" stroke-width="3.5" fill="none" stroke-linecap="round"/>'};
const sw=k=>`<svg viewBox="0 0 22 14" aria-hidden="true">${SW[k]}</svg>`;
function placeRow(p){return `<button class="row" data-place="${p.id}"><b><span class="dot" style="background:var(--c-${p.g})"></span>${esc(p.n)}</b><span class="m">${travel(p.d)}</span><span class="d">${esc(p.k)}</span></button>`}
function closedLine(p,wd){return (p.x||[]).includes(wd)}
function render(){const s=state.sel;let o='';
  if(s&&s.type==='place'){const p=byId[s.id],z=p.zone&&zById[p.zone];const dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    o+=`<button class="back" data-back="${z?z.id:''}">← ${z?esc(z.n):'Overview'}</button><h2>${esc(p.n)}</h2>${p.z!==p.n?`<div class="zh">${esc(p.z)}</div>`:''}<p>${esc(p.k)}</p>${p.tip?`<p class="lede">${esc(p.tip)}</p>`:''}
    <dl class="facts"><dt>Kind</dt><dd>${CATNAME[p.c]||p.c}</dd><dt>From hotel</dt><dd>${kmTxt(p.d)} ${COMPASS[Math.round(bearing(HOTEL,p)/45)%8]} · ${travel(p.d)}</dd><dt>Hours</dt><dd>${p.h==='24h'?'Open all day':esc((p.h||'Check locally').replace(/-/g,'–').replace(/,/g,', '))}${(p.x||[]).length?' · closed '+p.x.map(d=>dn[d]).join(', '):''}</dd><dt>Allow</dt><dd>${p.t>=90?(p.t/60).toFixed(1).replace('.0','')+' h':p.t+' min'}</dd>${p.m?`<dt>MRT</dt><dd>${esc(p.m)}</dd>`:''}</dl>
    <div class="btns"><a class="btn pri" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.z+' 台南')}">Open in Google Maps</a><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}">Directions</a></div>
    <p class="fine">Hours come from your trip places list and are not live. Check before you go.</p>`}
  else if(s&&s.type==='zone'){const z=zById[s.id],list=z.places.filter(pinVisible);
    o+=`<button class="back" data-back="">← Overview</button><h2>${esc(z.n)}</h2><div class="zh">${z.z}</div><p>${esc(z.feel)}</p>
    <dl class="facts"><dt>From hotel</dt><dd>${z.id==='home'?'You are in it':kmTxt(z.d)+' '+COMPASS[Math.round(bearing(HOTEL,z)/45)%8]+' · '+travel(z.d)}</dd><dt>Best</dt><dd>${esc(z.best)}</dd></dl>
    <h3>${list.length} ${state.group?GROUPS[state.group].label.toLowerCase():'places'} here</h3><div class="rows">${list.map(placeRow).join('')||'<p class="lede">Nothing of this kind in this zone. Switch the filter back to All places.</p>'}</div>`}
  else{
    o+=`<h1>Tainan, laid out</h1><p class="lede">18–21 Nov · based at Ta Lee Hotel, West Central District. Yellow washes are walkable zones; tap one, or any dot.</p>
    <div class="seg" role="group" aria-label="Show a day">${[['','Whole city'],['wed','Wed 18'],['thu','Thu 19'],['fri','Fri 20']].map(([d,l])=>`<button data-day="${d}" aria-pressed="${(state.day||'')===d}">${l}</button>`).join('')}</div>`;
    if(state.day){const D=DAYS[state.day];const shut=PL.filter(p=>p.p>=2&&D.steps.some(st=>st.z===p.zone)&&closedLine(p,D.wd));
      o+=`<h3>${D.label} · ${esc(D.title)}</h3><p style="margin:0 0 6px">${esc(D.lede)}</p><div>${D.steps.map((st,i)=>{const z=zById[st.z];return `<button class="step" data-zone="${z.id}"><i>${i+1}</i><span><small>${esc(st.when)} · ${z.id==='home'?'at your door':travel(z.d)+' from hotel'}</small><b>${esc(z.n)}</b><br>${esc(st.txt)}</span></button>`}).join('')}</div>`;
      if(shut.length)o+=`<div class="warn"><b>Closed ${D.wdName}:</b> ${shut.map(p=>esc(p.n)).join(', ')}.</div>`}
    else{
      o+=`<h3>How the city fits together</h3><div>${NOTES.map(n=>`<button class="note" data-note="${n.k}">${sw(n.sw)}<span><b>${esc(n.t)}.</b> ${esc(n.d)}</span></button>`).join('')}<div class="note">${sw('hsr')}<span><b>High-speed rail is out in Guiren.</b> HSR Tainan is ${kmTxt(dist(HOTEL,{lat:22.9247,lng:120.2864}))} southeast of the hotel. The Shalun branch train from Tainan Station takes about 25 minutes, a taxi about 30. That is your ride out on Sat 21.</span></div><div class="note">${sw('riv')}<span><b>Water on three sides.</b> The Tainan Canal loops between the old city and Anping, the Yanshui River runs along the north, and the Taiwan Strait is 6 km west of your hotel. Fish ponds and lagoons fill the flat land north of Anping.</span></div></div>`}
    o+=`<h3>Zones, nearest first</h3><div class="rows">${ZONES.slice().sort((a,b)=>a.d-b.d).map(z=>{const n=z.places.filter(pinVisible).length;return `<button class="row" data-zone="${z.id}"><b>${esc(z.n)}</b><span class="m">${z.id==='home'?'here':travel(z.d)}</span><span class="d">${z.z} · ${n} ${n===1?'place':'places'}</span></button>`}).join('')}</div>`;
    const loose=PL.filter(p=>p.on&&!p.zone&&pinVisible(p)).sort((a,b)=>a.d-b.d);
    if(loose.length)o+=`<h3>On the map, outside the zones</h3><div class="rows">${loose.map(placeRow).join('')}</div>`;
    const far=PL.filter(p=>!p.on&&pinVisible(p)).sort((a,b)=>a.d-b.d);
    if(far.length)o+=`<h3>Beyond the map</h3><div class="rows">${far.map(p=>{const b=bearing(HOTEL,p);return `<button class="row" data-place="${p.id}"><b><svg class="arrow" viewBox="0 0 14 14" style="transform:rotate(${Math.round(b)}deg)" aria-hidden="true"><path d="M7 1 12 12 7 9.5 2 12z" fill="currentColor"/></svg>${esc(p.n)}</b><span class="m">${Math.round(p.d/1000)} km ${COMPASS[Math.round(b/45)%8]}</span><span class="d">${esc(p.k)}</span></button>`}).join('')}</div>`;
    o+=`<p class="fine">Walking times assume 80 m a minute on streets about 1.3× the straight line. Taxi times are rough. Places and hours come from your trip places list.</p>`}
  panel.innerHTML=o}
panel.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if('day' in d)setDay(d.day||null);
  else if(d.zone)select({type:'zone',id:d.zone});
  else if(d.place)select({type:'place',id:d.place});
  else if('back' in d){if(d.back)select({type:'zone',id:d.back},true);else select(null)}
  else if(d.note){const n=NOTES.find(n=>n.k===d.note);fit(n.box,true)}});

new ResizeObserver(resize).observe(wrap);
cw=wrap.clientWidth||1;ch=wrap.clientHeight||1;fit(HOMEBOX,false);paint();render();
</script>
</body></html>
